<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>TVNow</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;1,9..40,400&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root {
  --bg:        #080a0f;
  --surface:   #0e1017;
  --surface2:  #141720;
  --surface3:  #1a1e2b;
  --border:    #1f2435;
  --border2:   #252b3d;
  --accent:    #4f7fff;
  --accent-dim:#2a3d6e;
  --accent-glow:rgba(79,127,255,0.15);
  --text:      #dde2f0;
  --text-dim:  #a0a8c0;
  --muted:     #505878;
  --green:     #34d399;
  --green-dim: #0d3326;
  --red:       #f87171;
  --red-dim:   #3d1515;
  --amber:     #fbbf24;
  --radius:    8px;
  --sidebar:   220px;
  --topbar-h:  52px;
}
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: 'DM Sans', system-ui, sans-serif;
  background: var(--bg);
  color: var(--text);
  height: 100vh;
  display: flex;
  overflow: hidden;
  font-size: 14px;
  -webkit-font-smoothing: antialiased;
}

/* ── Sidebar ─────────────────────────────────────── */
#sidebar {
  width: var(--sidebar);
  min-width: var(--sidebar);
  background: var(--surface);
  border-right: 1px solid var(--border);
  display: flex;
  flex-direction: column;
  z-index: 10;
}
#sidebar-header {
  height: var(--topbar-h);
  padding: 0 16px;
  display: flex;
  align-items: center;
  gap: 9px;
  border-bottom: 1px solid var(--border);
  flex-shrink: 0;
}
.logo-mark {
  width: 28px; height: 28px;
  background: var(--accent);
  border-radius: 7px;
  display: flex; align-items: center; justify-content: center;
  font-size: 14px; font-weight: 700; color: #fff; letter-spacing: -1px;
  flex-shrink: 0;
  box-shadow: 0 0 16px rgba(79,127,255,0.35);
}
.brand-name {
  font-size: 15px; font-weight: 700; letter-spacing: -.4px; color: #fff;
}
.brand-name span { color: var(--accent); }

nav { flex: 1; padding: 6px 8px; overflow-y: auto; }
nav a {
  display: flex;
  align-items: center;
  gap: 9px;
  padding: 7px 10px;
  color: var(--muted);
  text-decoration: none;
  border-radius: 6px;
  margin-bottom: 1px;
  font-size: 13px;
  font-weight: 500;
  transition: background .12s, color .12s;
  cursor: pointer;
  user-select: none;
}
nav a:hover  { background: var(--surface2); color: var(--text-dim); }
nav a.active { background: var(--accent-glow); color: var(--accent); }
nav a .nav-icon { width: 16px; text-align: center; font-size: 13px; flex-shrink: 0; }

.nav-section {
  font-size: 10px;
  font-weight: 600;
  letter-spacing: .8px;
  text-transform: uppercase;
  color: var(--muted);
  padding: 10px 10px 4px;
  margin-top: 4px;
}

#sidebar-footer {
  padding: 10px 12px 12px;
  border-top: 1px solid var(--border);
  flex-shrink: 0;
}
.sys-row {
  display: flex;
  justify-content: space-between;
  align-items: center;
  font-size: 11px;
  color: var(--muted);
  margin-bottom: 3px;
}
.sys-row span:last-child { color: var(--text-dim); font-family: 'DM Mono', monospace; font-size: 10px; }
.sys-bar {
  height: 2px;
  background: var(--border2);
  border-radius: 2px;
  overflow: hidden;
  margin-bottom: 6px;
}
.sys-bar-fill {
  height: 100%;
  background: var(--accent);
  border-radius: 2px;
  transition: width .5s ease;
}

/* ── Main layout ─────────────────────────────────── */
#main { flex: 1; display: flex; flex-direction: column; overflow: hidden; min-width: 0; }
#topbar {
  height: var(--topbar-h);
  padding: 0 20px;
  border-bottom: 1px solid var(--border);
  display: flex;
  align-items: center;
  justify-content: space-between;
  background: var(--surface);
  flex-shrink: 0;
  gap: 12px;
}
#topbar h1 {
  font-size: 14px;
  font-weight: 600;
  color: var(--text);
  letter-spacing: -.2px;
}
#topbar .actions { display: flex; gap: 8px; align-items: center; flex-shrink: 0; }
#content { flex: 1; overflow-y: auto; padding: 18px 20px; }

/* ── Cards ───────────────────────────────────────── */
.card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 16px;
  margin-bottom: 12px;
}
.card-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 14px;
}
.card-title { font-weight: 600; font-size: 13px; color: var(--text); letter-spacing: -.1px; }

/* ── Stat boxes ──────────────────────────────────── */
.stat-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px,1fr)); gap: 10px; }
.stat-box {
  background: var(--surface2);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 14px 16px;
  transition: border-color .15s;
}
.stat-box:hover { border-color: var(--border2); }
.stat-box .label {
  color: var(--muted);
  font-size: 10px;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: .6px;
}
.stat-box .value {
  font-size: 26px;
  font-weight: 700;
  margin-top: 5px;
  color: #fff;
  line-height: 1;
  letter-spacing: -1px;
  font-feature-settings: "tnum";
}
.stat-box .sub { font-size: 11px; color: var(--muted); margin-top: 4px; }

/* ── Tables ──────────────────────────────────────── */
table { width: 100%; border-collapse: collapse; }
th {
  text-align: left;
  padding: 7px 12px;
  font-size: 10px;
  font-weight: 600;
  color: var(--muted);
  text-transform: uppercase;
  letter-spacing: .6px;
  border-bottom: 1px solid var(--border);
  white-space: nowrap;
}
td {
  padding: 9px 12px;
  border-bottom: 1px solid var(--border);
  vertical-align: middle;
  font-size: 13px;
}
tr:last-child td { border-bottom: none; }
tr:hover td { background: rgba(255,255,255,0.02); }

.badge {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  padding: 2px 7px;
  border-radius: 20px;
  font-size: 10px;
  font-weight: 600;
  letter-spacing: .2px;
}
.badge::before { content: ''; width: 5px; height: 5px; border-radius: 50%; flex-shrink: 0; }
.badge.green { background: rgba(52,211,153,.1); color: var(--green); border: 1px solid rgba(52,211,153,.2); }
.badge.green::before { background: var(--green); }
.badge.red   { background: rgba(248,113,113,.1); color: var(--red);   border: 1px solid rgba(248,113,113,.2); }
.badge.red::before { background: var(--red); }
.badge.blue  { background: rgba(79,127,255,.12); color: var(--accent); border: 1px solid rgba(79,127,255,.25); }
.badge.blue::before { background: var(--accent); }
.badge.gray  { background: rgba(80,88,120,.15); color: var(--muted); border: 1px solid var(--border2); }
.badge.gray::before { background: var(--muted); }

/* ── Buttons ─────────────────────────────────────── */
.btn {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 6px 13px;
  border-radius: 6px;
  border: none;
  cursor: pointer;
  font-size: 12px;
  font-weight: 600;
  font-family: inherit;
  transition: opacity .12s, background .12s, box-shadow .12s;
  white-space: nowrap;
  letter-spacing: -.1px;
}
.btn:hover { opacity: .88; }
.btn:active { opacity: .75; }
.btn-primary {
  background: var(--accent);
  color: #fff;
  box-shadow: 0 1px 8px rgba(79,127,255,.3);
}
.btn-primary:hover { box-shadow: 0 2px 12px rgba(79,127,255,.45); opacity: 1; background: #6691ff; }
.btn-secondary {
  background: var(--surface2);
  color: var(--text-dim);
  border: 1px solid var(--border2);
}
.btn-secondary:hover { background: var(--surface3); color: var(--text); }
.btn-danger  {
  background: rgba(248,113,113,.1);
  color: var(--red);
  border: 1px solid rgba(248,113,113,.2);
}
.btn-danger:hover { background: rgba(248,113,113,.18); }
.btn-sm { padding: 4px 9px; font-size: 11px; border-radius: 5px; }
.btn-icon { padding: 5px 7px; border-radius: 5px; }

/* ── Forms ───────────────────────────────────────── */
.form-group { margin-bottom: 13px; }
label {
  display: block;
  font-size: 11px;
  font-weight: 600;
  color: var(--text-dim);
  margin-bottom: 5px;
  letter-spacing: .1px;
}
input, select, textarea {
  width: 100%;
  padding: 8px 11px;
  background: var(--surface2);
  border: 1px solid var(--border2);
  border-radius: 6px;
  color: var(--text);
  font-size: 13px;
  font-family: inherit;
  outline: none;
  transition: border-color .12s, box-shadow .12s;
}
input:focus, select:focus, textarea:focus {
  border-color: var(--accent);
  box-shadow: 0 0 0 3px rgba(79,127,255,.15);
}
input::placeholder { color: var(--muted); }
textarea { resize: vertical; min-height: 80px; }
.form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
select option { background: var(--surface2); }

/* ── Modal ───────────────────────────────────────── */
.modal-overlay {
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,.65);
  backdrop-filter: blur(4px);
  z-index: 100;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 20px;
  animation: fadeIn .15s ease;
}
@keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
.modal {
  background: var(--surface);
  border: 1px solid var(--border2);
  border-radius: 12px;
  padding: 22px;
  width: 100%;
  max-width: 500px;
  max-height: 90vh;
  overflow-y: auto;
  box-shadow: 0 24px 80px rgba(0,0,0,.6);
  animation: slideUp .18s ease;
}
@keyframes slideUp { from { transform: translateY(8px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
.modal-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 18px;
}
.modal-title { font-size: 15px; font-weight: 700; letter-spacing: -.2px; }
.modal-footer { display: flex; gap: 8px; justify-content: flex-end; margin-top: 18px; }

/* ── Channel grid ────────────────────────────────── */
.ch-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 8px; }
.ch-card {
  background: var(--surface2);
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 10px 12px;
  display: flex;
  align-items: center;
  gap: 10px;
  cursor: default;
  transition: border-color .12s, background .12s;
}
.ch-card:hover  { border-color: var(--border2); background: var(--surface3); }
.ch-card.disabled { opacity: .35; }
.ch-logo {
  width: 36px; height: 36px;
  border-radius: 6px;
  object-fit: contain;
  background: var(--surface);
  flex-shrink: 0;
}
.ch-logo-placeholder {
  width: 36px; height: 36px;
  border-radius: 6px;
  background: var(--surface3);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 15px;
  flex-shrink: 0;
  color: var(--muted);
}
.ch-info .name  { font-weight: 600; font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.ch-info .group { font-size: 11px; color: var(--muted); margin-top: 1px; }
.ch-info .num   { font-size: 10px; color: var(--accent); margin-bottom: 1px; font-weight: 600; font-family: 'DM Mono', monospace; }

/* ── EPG Guide ───────────────────────────────────── */
#guide-wrap { overflow-x: auto; }
.guide-table { border-collapse: collapse; min-width: 900px; width: 100%; }
.guide-table .ch-col { width: 150px; min-width: 150px; }
.guide-row td, .guide-row th { border: 1px solid var(--border); padding: 0; vertical-align: middle; }
.guide-ch-cell { padding: 7px 10px; background: var(--surface2); }
.guide-ch-cell .name { font-weight: 600; font-size: 11px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.guide-prog { padding: 6px 8px; font-size: 11px; cursor: default; }
.guide-prog.now { background: rgba(79,127,255,.15); border-left: 2px solid var(--accent); }
.guide-prog .prog-title { font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.guide-prog .prog-time  { font-size: 10px; color: var(--muted); margin-top: 2px; font-family: 'DM Mono', monospace; }

/* ── Source color palette & filters ─────────────── */
.src-dot { display:inline-block; width:8px; height:8px; border-radius:50%; margin-right:6px; flex-shrink:0; }
.guide-ch-cell.has-color { border-left: 3px solid var(--src-color, var(--border)); }
.guide-sort-bar { display:flex; gap:6px; align-items:center; flex-wrap:wrap; margin-bottom:12px; }
.guide-sort-bar label { font-size:10px; font-weight:600; color:var(--muted); text-transform:uppercase; letter-spacing:.6px; }
.src-filter-btn {
  display:inline-flex; align-items:center; padding:4px 9px;
  border-radius:20px; font-size:11px; font-weight:600;
  border:1px solid var(--border2); cursor:pointer;
  background:var(--surface2); color:var(--text-dim);
  transition:opacity .12s, background .12s;
}
.src-filter-btn:hover { background: var(--surface3); }
.src-filter-btn.inactive { opacity:.3; }
.src-filter-btn .dot { width:7px; height:7px; border-radius:50%; margin-right:5px; }

/* ── Search ──────────────────────────────────────── */
.search-wrap { position: relative; }
.search-wrap input { padding-left: 32px; }
.search-wrap .search-icon { position: absolute; left: 10px; top: 50%; transform: translateY(-50%); color: var(--muted); font-size: 12px; pointer-events: none; }

/* ── Logs ────────────────────────────────────────── */
#log-container {
  background: #06080d;
  border-radius: 6px;
  padding: 10px 12px;
  height: 420px;
  overflow-y: auto;
  font-family: 'DM Mono', 'Courier New', monospace;
  font-size: 11.5px;
  line-height: 1.6;
}
.log-entry { display: flex; gap: 8px; align-items: baseline; padding: 1px 0; }
.log-entry .ts   { color: #344060; flex-shrink: 0; font-size: 10px; }
.log-entry .lvl  { flex-shrink: 0; font-size: 9px; font-weight: 700; letter-spacing: .5px; padding: 1px 5px; border-radius: 3px; }
.log-entry.INFO  .lvl { background: rgba(79,127,255,.15); color: var(--accent); }
.log-entry.WARN  .lvl { background: rgba(251,191,36,.12); color: var(--amber); }
.log-entry.ERROR .lvl { background: rgba(248,113,113,.15); color: var(--red); }
.log-entry .msg { color: var(--text-dim); flex: 1; min-width: 0; word-break: break-all; }

/* ── Map members ─────────────────────────────────── */
.map-member {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 7px 10px;
  border-radius: 6px;
  background: var(--surface2);
  border: 1px solid var(--border);
  margin-bottom: 4px;
  transition: border-color .12s;
}
.map-member:hover { border-color: var(--border2); }
.map-member.disabled { opacity: .4; }
.priority-badge {
  width: 20px; height: 20px;
  border-radius: 50%;
  background: var(--surface3);
  border: 1px solid var(--border2);
  color: var(--muted);
  font-size: 10px;
  font-weight: 700;
  display: flex; align-items: center; justify-content: center;
  flex-shrink: 0;
  font-family: 'DM Mono', monospace;
}

/* ── Map logo & meta ─────────────────────────────── */
.map-logo-wrap {
  position: relative;
  cursor: pointer;
  border-radius: 8px;
  overflow: hidden;
  flex-shrink: 0;
}
.map-logo-wrap:hover .map-logo-edit-hint { opacity: 1; }
.map-logo-edit-hint {
  position: absolute; inset: 0;
  background: rgba(0,0,0,.55);
  display: flex; align-items: center; justify-content: center;
  font-size: 14px;
  opacity: 0;
  transition: opacity .15s;
}
.map-logo-edit-hint::after { content: '✎'; color: #fff; }
.map-logo-placeholder {
  width: 44px; height: 44px;
  border-radius: 8px;
  background: var(--surface2);
  border: 1px dashed var(--border2);
  display: flex; align-items: center; justify-content: center;
  color: var(--muted);
  font-size: 18px;
}
.map-logo-thumb {
  height: 18px;
  border-radius: 3px;
  object-fit: contain;
  vertical-align: middle;
}
.map-meta-badge {
  font-size: 11px;
  padding: 2px 7px;
  border-radius: 5px;
  background: var(--surface3);
  border: 1px solid var(--border2);
  color: var(--text-dim);
  white-space: nowrap;
  font-weight: 500;
}
.map-meta-badge.muted { color: var(--muted); }
.map-meta-btn {
  background: none; border: none; cursor: pointer; padding: 0;
  transition: opacity .12s;
}
.map-meta-btn:hover { opacity: .7; }

/* ── EPG strip ───────────────────────────────────── */
.map-epg-strip {
  display: flex; gap: 6px; overflow-x: auto;
  padding: 0 16px 12px;
  scrollbar-width: thin;
  scrollbar-color: var(--border2) transparent;
}
.epg-slot {
  flex-shrink: 0;
  min-width: 110px; max-width: 150px;
  padding: 6px 10px;
  border-radius: 6px;
  background: var(--surface2);
  border: 1px solid var(--border);
  overflow: hidden;
}
.epg-slot.current {
  background: rgba(79,127,255,.1);
  border-color: rgba(79,127,255,.3);
}
.epg-progress { height: 2px; background: var(--border2); border-radius: 2px; margin-top: 5px; overflow: hidden; }
.epg-progress-fill { height: 100%; background: var(--accent); border-radius: 2px; }

/* ── Pills & misc ────────────────────────────────── */
.pill {
  display: inline-block;
  padding: 1px 7px;
  border-radius: 20px;
  font-size: 10px;
  font-weight: 600;
  background: var(--surface3);
  color: var(--muted);
  border: 1px solid var(--border2);
  letter-spacing: .1px;
}
.empty-state { text-align: center; padding: 60px 20px; color: var(--muted); }
.empty-state .icon { font-size: 40px; margin-bottom: 12px; opacity: .5; }
.empty-state h3 { font-size: 15px; font-weight: 600; color: var(--text-dim); margin-bottom: 6px; }
.empty-state p { font-size: 13px; }

.hidden { display: none !important; }
.flex { display: flex; }
.gap-8 { gap: 8px; }
.ml-auto { margin-left: auto; }
.text-muted { color: var(--muted); }
.text-sm { font-size: 12px; }

/* ── Toast ───────────────────────────────────────── */
#toast-container {
  position: fixed; bottom: 20px; right: 20px; z-index: 200;
  display: flex; flex-direction: column; gap: 6px;
}
.toast {
  background: var(--surface);
  border: 1px solid var(--border2);
  border-radius: 8px;
  padding: 9px 14px;
  font-size: 12px;
  font-weight: 500;
  animation: toastIn .18s ease;
  max-width: 300px;
  box-shadow: 0 8px 30px rgba(0,0,0,.4);
  display: flex; align-items: center; gap: 7px;
}
.toast::before { content: ''; width: 6px; height: 6px; border-radius: 50%; flex-shrink: 0; }
.toast.success { border-color: rgba(52,211,153,.3); color: var(--green); }
.toast.success::before { background: var(--green); }
.toast.error   { border-color: rgba(248,113,113,.3); color: var(--red); }
.toast.error::before { background: var(--red); }
@keyframes toastIn { from { transform: translateX(12px); opacity: 0; } to { transform: translateX(0); opacity: 1; } }

/* ── Scrollbar ───────────────────────────────────── */
::-webkit-scrollbar { width: 5px; height: 5px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: var(--border2); border-radius: 3px; }
::-webkit-scrollbar-thumb:hover { background: var(--muted); }

/* ── Code ────────────────────────────────────────── */
code {
  font-family: 'DM Mono', monospace;
  background: var(--surface2);
  border: 1px solid var(--border2);
  padding: 1px 6px;
  border-radius: 4px;
  font-size: .9em;
  color: var(--accent);
}

/* ── Divider ─────────────────────────────────────── */
.section-divider {
  font-size: 10px;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: .7px;
  color: var(--muted);
  padding: 12px 0 6px;
}

/* ── inp alias ───────────────────────────────────── */
.inp { width: 100%; padding: 8px 11px; background: var(--surface2); border: 1px solid var(--border2); border-radius: 6px; color: var(--text); font-size: 13px; font-family: inherit; outline: none; transition: border-color .12s; }
.inp:focus { border-color: var(--accent); }
/* ── Logo picker ─────────────────────────────────── */
.logo-pick-btn {
  background: var(--surface2);
  border: 2px solid var(--border);
  border-radius: 8px;
  padding: 8px;
  cursor: pointer;
  transition: border-color .12s;
  text-align: center;
}
.logo-pick-btn:hover { border-color: var(--border2); }
.logo-pick-btn.active { border-color: var(--accent); background: var(--accent-glow); }

/* ── Dedup rows ──────────────────────────────────── */
.dedup-src-row {
  display: flex; align-items: center; gap: 10px;
  padding: 8px 12px;
  border: 1px solid var(--border); border-radius: 6px;
  background: var(--surface2); cursor: grab;
  margin-bottom: 4px; font-size: 13px; transition: background .1s;
}
.dedup-src-row:hover { background: var(--surface3); }

/* ── Stat-box clickable ──────────────────────────── */
.stat-box[onclick] { cursor: pointer; }
.stat-box[onclick]:hover { border-color: var(--accent); }

/* ── Links ───────────────────────────────────────── */
a { color: var(--accent); text-decoration: none; }
a:hover { text-decoration: underline; }

/* ── Nav active left bar ─────────────────────────── */
nav a { position: relative; }
nav a.active::before {
  content: '';
  width: 2px; height: 14px;
  background: var(--accent);
  border-radius: 2px;
  position: absolute; left: 0; top: 50%; transform: translateY(-50%);
}

/* ── Content fade-in ─────────────────────────────── */
#content > .card, #content > .stat-grid, #content > div {
  animation: contentFade .15s ease;
}
@keyframes contentFade { from { opacity: 0; transform: translateY(3px); } to { opacity: 1; transform: translateY(0); } }

/* ── Monospace helper ────────────────────────────── */
.mono { font-family: 'DM Mono', monospace; font-size: .9em; }

/* ── Number inputs clean ─────────────────────────── */
input[type="number"] { -moz-appearance: textfield; text-align: center; }
input[type="number"]::-webkit-outer-spin-button,
input[type="number"]::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }

/* ── Color picker ────────────────────────────────── */
input[type="color"] {
  height: 38px; padding: 3px 5px; cursor: pointer;
  border-radius: 6px; border: 1px solid var(--border2); background: var(--surface2);
}

/* ── Guide time headers ──────────────────────────── */
.guide-table thead th {
  font-family: 'DM Mono', monospace !important;
  font-size: 10px !important; font-weight: 500 !important;
  background: var(--surface2) !important; border-color: var(--border) !important;
}

/* ── Topbar gradient ─────────────────────────────── */
#topbar { background: linear-gradient(180deg, #10131c 0%, #0e1017 100%); }

/* ── EPG result rows ─────────────────────────────── */
.epg-result-row {
  display: flex; align-items: flex-start; gap: 10px;
  padding: 8px 10px; border-radius: 6px; cursor: pointer;
  background: var(--surface2); transition: background .1s; margin-bottom: 2px;
}
.epg-result-row:hover { background: var(--surface3); }
.epg-result-row.active { background: var(--accent-glow); border: 1px solid rgba(79,127,255,.25); }

/* ── Checkbox ────────────────────────────────────── */
input[type="checkbox"] { width: 16px; height: 16px; accent-color: var(--accent); }

/* ── Event tags for webhooks ─────────────────────── */
.event-tag {
  display: inline-block; padding: 1px 6px;
  border-radius: 4px; font-size: 10px; font-weight: 600;
  background: var(--surface3); border: 1px solid var(--border2);
  color: var(--text-dim); margin: 1px;
  font-family: 'DM Mono', monospace;
}

/* ── Open-access warning banner ──────────────────── */
.open-access-banner {
  padding: 10px 14px;
  background: rgba(251,191,36,.07);
  border: 1px solid rgba(251,191,36,.2);
  border-radius: 8px;
  margin-bottom: 12px;
  font-size: 13px;
  color: var(--amber);
}

/* ── Scrollbar refinement ────────────────────────── */
nav::-webkit-scrollbar { width: 3px; }
nav::-webkit-scrollbar-thumb { background: var(--border); }
</style>
</head>
<body>

<!-- Sidebar -->
<div id="sidebar">
  <div id="sidebar-header">
    <div class="logo-mark">TV</div>
    <div class="brand-name">TV<span>Now</span></div>
  </div>
  <nav>
    <div class="nav-section">Main</div>
    <a class="active" data-page="dashboard" onclick="navigate('dashboard')"><span class="nav-icon">⊞</span> Dashboard</a>
    <a data-page="guide"    onclick="navigate('guide')"><span class="nav-icon">▦</span> Guide</a>
    <a data-page="channels" onclick="navigate('channels')"><span class="nav-icon">≡</span> Channels</a>
    <a data-page="maps"     onclick="navigate('maps')"><span class="nav-icon">⇄</span> Channel Maps</a>
    <div class="nav-section">Data</div>
    <a data-page="epg"      onclick="navigate('epg')"><span class="nav-icon">◷</span> EPG Sources</a>
    <div class="nav-section">System</div>
    <a data-page="health"   onclick="navigate('health')"><span class="nav-icon">♥</span> Stream Health</a>
    <a data-page="transcode" onclick="navigate('transcode')"><span class="nav-icon">⚙</span> Transcode</a>
    <a data-page="webhooks" onclick="navigate('webhooks')"><span class="nav-icon">⚡</span> Webhooks</a>
    <a data-page="users"    onclick="navigate('users')"><span class="nav-icon">◎</span> Users</a>
    <a data-page="export"   onclick="navigate('export')"><span class="nav-icon">↗</span> Export</a>
    <a data-page="logs"     onclick="navigate('logs')"><span class="nav-icon">▤</span> Logs</a>
    <a data-page="settings" onclick="navigate('settings')"><span class="nav-icon">⊛</span> Settings</a>
  </nav>
  <div id="sidebar-footer">
    <div class="sys-row"><span>Memory</span><span id="mem-pct">—</span></div>
    <div class="sys-bar"><div class="sys-bar-fill" id="mem-bar" style="width:0%"></div></div>
    <div class="sys-row"><span>CPU Load</span><span id="cpu-load">—</span></div>
    <div class="sys-row" id="gpu-row" style="display:none"><span>GPU</span><span id="gpu-pct">—</span></div>
  </div>
</div>

<!-- Main -->
<div id="main">
  <div id="topbar">
    <h1 id="page-title">Dashboard</h1>
    <div class="actions" id="topbar-actions"></div>
  </div>
  <div id="content"></div>
</div>

<!-- Toast -->
<div id="toast-container"></div>

<script>
// 
//  State
// 
let currentPage = 'dashboard';
let _sources = [], _channels = [], _epgSources = [];
let _guideSourceFilter = null; // null = all, or source id
let _pluginTypes = [];


// 
//  Utilities
// 
async function api(path, opts={}) {
  const res = await fetch(path, { headers: {'Content-Type':'application/json'}, ...opts });
  const data = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(data.error || `HTTP ${res.status}`);
  return data;
}

function toast(msg, type='success') {
  const el = document.createElement('div');
  el.className = `toast ${type}`;
  el.textContent = msg;
  document.getElementById('toast-container').appendChild(el);
  setTimeout(() => el.remove(), 3000);
}

function fmt(n) { return n == null ? '' : String(n); }
function fmtTime(unix) {
  if (!unix) return '';
  return new Date(unix * 1000).toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'});
}
function fmtDuration(s, e) {
  if (!s || !e) return '';
  const m = Math.round((e - s) / 60);
  return m >= 60 ? `${Math.floor(m/60)}h ${m%60}m` : `${m}m`;
}
function esc(s) { const d = document.createElement('div'); d.textContent = s||''; return d.innerHTML; }
function unesc(s) {
  // Decode HTML entities stored in DB (e.g. &amp;  &) before display
  if (!s || !s.includes('&')) return s||'';
  const d = document.createElement('div'); d.innerHTML = s; return d.textContent||'';
}
function jsq(v) { return JSON.stringify(v == null ? '' : String(v)); }

function modal(html, { onConfirm, title } = {}) {
  const overlay = document.createElement('div');
  overlay.className = 'modal-overlay';
  overlay.innerHTML = `<div class="modal">${html}</div>`;
  document.body.appendChild(overlay);
  overlay.addEventListener('click', e => { if (e.target === overlay) overlay.remove(); });
  return overlay;
}

// 
//  Navigation
// 
function navigate(page) {
  if (page === 'sources') page = 'settings';
  currentPage = page;
  try { localStorage.setItem('tvnow_page', page); } catch(_) {}
  document.querySelectorAll('nav a').forEach(a => a.classList.toggle('active', a.dataset.page === page));
  document.getElementById('page-title').textContent = {
    dashboard:'Dashboard', guide:'TV Guide', channels:'Channels', maps:'Channel Maps',
    epg:'EPG Sources', export:'Export', logs:'System Logs',
    settings:'Settings', health:'Stream Health', transcode:'Transcode Profiles',
    webhooks:'Webhooks', users:'User Management',
  }[page] || page;
  document.getElementById('topbar-actions').innerHTML = '';
  renderPage(page);
}

async function renderPage(page) {
  if (page === 'sources') page = 'settings';
  const c = document.getElementById('content');
  c.innerHTML = '<div class="empty-state" style="padding:40px 20px"><div style="color:var(--muted);font-size:13px">Loading…</div></div>';
  try {
    if (page === 'dashboard') await renderDashboard();
    if (page === 'guide')     await renderGuide();
    if (page === 'channels')  await renderChannels();
    if (page === 'maps')      await renderMaps();
    if (page === 'epg')       await renderEpgSources();
    if (page === 'health')    await renderStreamHealth();
    if (page === 'transcode') await renderTranscodeProfiles();
    if (page === 'webhooks')  await renderWebhooks();
    if (page === 'users')     await renderUsers();
    if (page === 'export')    renderExport();
    if (page === 'logs')      await renderLogs();
    if (page === 'settings')  await renderSettings();
  } catch(err) {
    c.innerHTML = `<div class="empty-state"><div class="icon"></div><p>${esc(err.message)}</p></div>`;
  }
}

// 
//  Dashboard
// 
async function renderDashboard() {
  const [sources, channels, sys, health] = await Promise.all([
    api('/api/sources'),
    api('/api/channels'),
    api('/api/system').catch(() => null),
    api('/api/stream-health/active').catch(() => ({ active_streams: 0 })),
  ]);
  _sources  = sources;
  _channels = channels;

  const enabled   = channels.filter(c => c.enabled).length;
  const srcActive = sources.filter(s => s.enabled).length;

  const c = document.getElementById('content');
  c.innerHTML = `
    <div class="stat-grid" style="margin-bottom:20px">
      <div class="stat-box"><div class="label">Sources</div><div class="value">${sources.length}</div><div class="sub">${srcActive} active</div></div>
      <div class="stat-box"><div class="label">Channels</div><div class="value">${channels.length}</div><div class="sub">${enabled} enabled</div></div>
      <div class="stat-box" style="cursor:pointer" onclick="navigate('health')"><div class="label">Active Streams</div><div class="value">${health.active_streams}</div><div class="sub">live viewers</div></div>
      <div class="stat-box"><div class="label">Uptime</div><div class="value" id="uptime-val">${sys ? _fmtUptime(sys.uptime) : ''}</div><div class="sub">server</div></div>
      ${sys?.gpu ? `<div class="stat-box"><div class="label">GPU</div><div class="value">${sys.gpu.gpuPct}%</div><div class="sub">${sys.gpu.name}</div></div>` : ''}
    </div>

    <div class="card">
      <div class="card-header"><div class="card-title">Source</div><button class="btn btn-secondary btn-sm" onclick="navigate('settings')">Manage →</button></div>
      ${sources.length === 0 ? '<div class="empty-state" style="padding:20px"><p>No source configured yet. Open <a href="#" onclick="navigate(\'settings\')">Settings</a>.</p></div>' : `
      <table>
        <thead><tr><th>Name</th><th>Type</th><th>Channels</th><th>Last Sync</th><th>Status</th></tr></thead>
        <tbody>${sources.map(s => {
          const chs = channels.filter(c => c.source_id === s.id).length;
          const color = s.color || SOURCE_COLORS[sources.findIndex(x=>x.id===s.id) % SOURCE_COLORS.length];
          const lastSync = s.last_sync ? new Date(s.last_sync).toLocaleString([],{month:'short',day:'numeric',hour:'2-digit',minute:'2-digit'}) : '—';
          return `<tr>
            <td>
              <div style="display:flex;align-items:center;gap:8px">
                <span style="width:8px;height:8px;border-radius:50%;background:${color};flex-shrink:0"></span>
                <span style="font-weight:600">${esc(s.name)}</span>
              </div>
            </td>
            <td><span class="pill" style="font-family:'DM Mono',monospace">${esc(s.type)}</span></td>
            <td style="font-family:'DM Mono',monospace;font-size:12px">${chs}</td>
            <td style="color:var(--muted);font-size:11px;font-family:'DM Mono',monospace">${lastSync}</td>
            <td><span class="badge ${s.enabled ? 'green' : 'gray'}">${s.enabled ? 'Active' : 'Disabled'}</span></td>
          </tr>`;
        }).join('')}</tbody>
      </table>`}
    </div>

    ${sys ? `<div class="card">
      <div class="card-header"><div class="card-title">System</div></div>
      <div class="stat-grid">
        <div class="stat-box"><div class="label">Memory Used</div><div class="value">${sys.memory.usedMb} MB</div><div class="sub">of ${sys.memory.totalMb} MB (${sys.memory.pct}%)</div></div>
        <div class="stat-box"><div class="label">CPU Cores</div><div class="value">${sys.cpu.cores}</div><div class="sub">Load: ${sys.cpu.load1} / ${sys.cpu.load5} / ${sys.cpu.load15}</div></div>
        ${sys.gpu ? `<div class="stat-box"><div class="label">GPU Mem</div><div class="value">${sys.gpu.memUsedMb} MB</div><div class="sub">of ${sys.gpu.memTotalMb} MB - ${sys.gpu.tempC} degC</div></div>` : ''}
      </div>
    </div>` : ''}
  `;
}

function _fmtUptime(s) {
  const h = Math.floor(s / 3600), m = Math.floor((s % 3600) / 60);
  return h > 0 ? `${h}h ${m}m` : `${m}m`;
}

// 
//  TV Guide
// 
const SOURCE_COLORS = ['#3b82f6','#22c55e','#f59e0b','#ef4444','#8b5cf6','#06b6d4','#ec4899','#84cc16','#f97316','#14b8a6'];

function getSourceColor(sourceId) {
  const src = _sources.find(s => s.id === sourceId);
  if (src && src.color) return src.color;
  const idx = _sources.findIndex(s => s.id === sourceId);
  return SOURCE_COLORS[Math.max(0, idx) % SOURCE_COLORS.length];
}

async function renderGuide() {
  const c = document.getElementById('content');
  const now   = Math.floor(Date.now() / 1000);
  const from  = now - 1800;
  const to    = now + 4 * 3600;

  [_sources, _channels] = await Promise.all([api('/api/sources'), api('/api/channels?enabled=1')]);
  const programs = await api(`/api/epg/guide?from=${from}&to=${to}`);

  const progMap = {};
  for (const p of programs) {
    if (!progMap[p.epg_id]) progMap[p.epg_id] = [];
    progMap[p.epg_id].push(p);
  }

  // Build time slots
  const slots = [];
  let t = Math.floor(from / 1800) * 1800;
  while (t < to) { slots.push(t); t += 1800; }

  // Source filter buttons
  const activeSources = _sources.filter(s => _channels.some(ch => ch.source_id === s.id));
  const filterBar = activeSources.length > 1 ? `
    <div class="guide-sort-bar">
      <label>Filter by source:</label>
      ${activeSources.map(s => {
        const color = getSourceColor(s.id);
        const active = _guideSourceFilter === null || _guideSourceFilter === s.id;
        return `<button class="src-filter-btn ${active ? '' : 'inactive'}" onclick="toggleGuideSourceFilter(${s.id})" style="border-color:${color}">
          <span class="dot" style="background:${color}"></span>${esc(s.name)}
        </button>`;
      }).join('')}
      ${_guideSourceFilter !== null ? `<button class="btn btn-sm btn-secondary" onclick="_guideSourceFilter=null;renderGuide()">Show All</button>` : ''}
    </div>` : '';

  // Sort: if filter active show that source's channels first, then others
  let channels = [..._channels];
  if (_guideSourceFilter !== null) {
    channels = channels.filter(ch => ch.source_id === _guideSourceFilter);
  } else {
    // Sort by source order
    channels.sort((a, b) => {
      const ai = _sources.findIndex(s => s.id === a.source_id);
      const bi = _sources.findIndex(s => s.id === b.source_id);
      return ai - bi;
    });
  }

  c.innerHTML = `
    ${filterBar}
    <div class="card" style="padding:0;overflow:hidden">
      <div id="guide-wrap">
        <table class="guide-table">
          <thead><tr>
            <th class="ch-col" style="padding:8px 10px;background:var(--surface2)">Channel</th>
            ${slots.map(s => `<th style="padding:8px;background:var(--surface2);font-weight:400;color:var(--muted);min-width:120px">${fmtTime(s)}</th>`).join('')}
          </tr></thead>
          <tbody>
            ${channels.map(ch => {
              const progs = progMap[ch.epg_id] || [];
              const color = getSourceColor(ch.source_id);
              return `<tr class="guide-row">
                <td><div class="guide-ch-cell has-color" style="--src-color:${color}">
                  ${ch.logo_url ? `<img src="${esc(ch.logo_url)}" style="width:24px;height:24px;border-radius:4px;object-fit:contain;vertical-align:middle;margin-right:6px">` : ''}
                  <span class="name">${esc(ch.name)}</span>
                </div></td>
                ${slots.map((s) => {
                  const slotEnd = s + 1800;
                  const prog = progs.find(p => p.start_time < slotEnd && p.end_time > s);
                  if (!prog) return `<td style="background:var(--surface2);min-width:120px"><div class="guide-prog text-muted" style="font-size:11px">No data</div></td>`;
                  const isNow = now >= prog.start_time && now < prog.end_time;
                  return `<td style="min-width:120px"><div class="guide-prog ${isNow ? 'now' : ''}">
                    <div class="prog-title">${esc(prog.title)}</div>
                    <div class="prog-time">${fmtTime(prog.start_time)} - ${fmtDuration(prog.start_time, prog.end_time)}</div>
                  </div></td>`;
                }).join('')}
              </tr>`;
            }).join('')}
          </tbody>
        </table>
      </div>
    </div>
  `;
}

function toggleGuideSourceFilter(sourceId) {
  _guideSourceFilter = (_guideSourceFilter === sourceId) ? null : sourceId;
  try { localStorage.setItem('tvnow_guideFilter', _guideSourceFilter === null ? '' : String(_guideSourceFilter)); } catch(_) {}
  renderGuide();
}

// 
//  Channels
// 
async function renderChannels() {
  _channels = await api('/api/channels');
  _sources  = await api('/api/sources');

  const tb = document.getElementById('topbar-actions');
  tb.innerHTML = `
    <div class="search-wrap"><span class="search-icon"></span><input id="ch-search" placeholder="Search channels" oninput="filterChannels()" style="width:220px"></div>
    <button class="btn btn-secondary" onclick="showDedupModal()" title="Remove duplicate channels"> Dedupe Channels</button>
  `;

  // Restore persisted search
  try {
    const saved = localStorage.getItem('tvnow_chSearch');
    if (saved) { const el = document.getElementById('ch-search'); if (el) el.value = saved; }
  } catch(_) {}

  filterChannels();
}

function filterChannels() {
  const q = document.getElementById('ch-search')?.value.toLowerCase() || '';
  try { localStorage.setItem('tvnow_chSearch', document.getElementById('ch-search')?.value || ''); } catch(_) {}
  const filtered = q ? _channels.filter(c => c.name.toLowerCase().includes(q) || (c.group_name||'').toLowerCase().includes(q)) : _channels;
  renderChannelList(filtered);
}

function renderChannelList(channels) {
  const c = document.getElementById('content');
  if (!channels.length) {
    c.innerHTML = `<div class="empty-state"><div class="icon"></div><h3>No channels</h3><p>Add a source to import channels.</p></div>`;
    return;
  }

  // Group by source
  const bySource = {};
  for (const ch of channels) {
    const src = _sources.find(s => s.id === ch.source_id);
    const key = src ? `${src.name} (${src.type})` : 'Unknown Source';
    if (!bySource[key]) bySource[key] = [];
    bySource[key].push(ch);
  }

  c.innerHTML = Object.entries(bySource).map(([srcName, chs]) => `
    <div class="card">
      <div class="card-header">
        <div class="card-title">${esc(srcName)}</div>
        <span class="pill">${chs.length} channels</span>
      </div>
      <div class="ch-grid">
        ${chs.map(ch => `
          <div class="ch-card ${ch.enabled ? '' : 'disabled'}" title="${esc(ch.name)}">
            ${ch.logo_url
              ? `<img class="ch-logo" src="${esc(ch.logo_url)}" onerror="this.style.display='none'">`
              : `<div class="ch-logo-placeholder"></div>`}
            <div class="ch-info" style="min-width:0">
              ${ch.number ? `<div class="num">CH ${esc(ch.number)}</div>` : ''}
              <div class="name">${esc(ch.name)}</div>
              ${ch.group_name ? `<div class="group">${unesc(ch.group_name)}</div>` : ''}
            </div>
            <div style="margin-left:auto;display:flex;flex-direction:column;gap:4px">
              <button class="btn btn-sm btn-secondary btn-icon" onclick="toggleChannel(${ch.id})" title="${ch.enabled ? 'Disable' : 'Enable'}">${ch.enabled ? '' : '-'}</button>
              <button class="btn btn-sm btn-secondary btn-icon" onclick="playChannel(${ch.id})" title="Play stream">-</button>
            </div>
          </div>
        `).join('')}
      </div>
    </div>
  `).join('');
}

async function toggleChannel(id) {
  await api(`/api/channels/${id}/toggle`, { method: 'POST' });
  const ch = _channels.find(c => c.id === id);
  if (ch) ch.enabled = ch.enabled ? 0 : 1;
  filterChannels();
}

function playChannel(id) {
  const url = `${window.location.origin}/stream/${id}`;
  // Try to open in a video player  use an in-page modal with a video tag for HLS
  const overlay = document.createElement('div');
  overlay.className = 'modal-overlay';
  overlay.innerHTML = `
    <div class="modal" style="max-width:720px;width:95%">
      <div class="modal-header">
        <div class="modal-title">- Stream Preview</div>
        <button class="btn btn-icon btn-secondary" onclick="this.closest('.modal-overlay').remove()"></button>
      </div>
      <video id="preview-video" controls autoplay style="width:100%;border-radius:8px;background:#000;min-height:200px" src="${url}"></video>
      <div style="margin-top:12px;display:flex;gap:8px;flex-wrap:wrap;align-items:center">
        <span style="color:var(--muted);font-size:12px;flex:1;word-break:break-all">${url}</span>
        <button class="btn btn-sm btn-secondary" onclick="navigator.clipboard.writeText('${url}').then(()=>toast('URL copied!'))">Copy URL</button>
        <a href="${url}" target="_blank" class="btn btn-sm btn-secondary">Open in Browser</a>
        <a href="vlc://${url}" class="btn btn-sm btn-secondary">Open in VLC</a>
      </div>
      <p style="color:var(--muted);font-size:11px;margin-top:8px">
        Note: Browser playback requires HLS support. For best results use VLC or copy the URL into your media player.
      </p>
    </div>`;
  document.body.appendChild(overlay);
  overlay.addEventListener('click', e => {
    if (e.target === overlay) {
      const v = overlay.querySelector('video');
      if (v) { v.pause(); v.src = ''; }
      overlay.remove();
    }
  });
}

// 
//  Channel Maps  --  Smart Stream Mapping
// 

let _maps        = [];
let _mapSettings = { market_type: '', market_name: '' }; // global market context

async function renderMaps() {
  const tb = document.getElementById('topbar-actions');
  tb.innerHTML = `
    <div style="display:flex;align-items:center;gap:8px">
      <select id="global-market-type" onchange="_saveMarketCtx()" style="padding:5px 8px;border:1px solid var(--border2);border-radius:6px;background:var(--surface2);color:var(--text);font-size:12px;font-family:inherit">
        <option value="">Any Market</option>
        <option value="OTA">OTA</option>
        <option value="SAT">Satellite</option>
        <option value="Cable">Cable</option>
      </select>
      <input id="global-market-name" placeholder="Market (e.g. Chicago)" oninput="_saveMarketCtx()"
        style="width:140px;padding:5px 9px;border:1px solid var(--border2);border-radius:6px;background:var(--surface2);color:var(--text);font-size:12px;font-family:inherit">
      <button class="btn btn-secondary btn-sm" onclick="showImportMapM3UModal()">Import M3U</button>
      <button class="btn btn-primary" onclick="showCreateMapModal()">+ New Map</button>
    </div>
  `;
  // Restore saved market context
  try {
    const saved = JSON.parse(localStorage.getItem('tvnow_marketCtx') || '{}');
    if (saved.market_type) { document.getElementById('global-market-type').value = saved.market_type; _mapSettings.market_type = saved.market_type; }
    if (saved.market_name) { document.getElementById('global-market-name').value = saved.market_name; _mapSettings.market_name = saved.market_name; }
  } catch(_) {}

  _maps = await api('/api/channel-maps');
  _renderMapList();
}

function _saveMarketCtx() {
  _mapSettings.market_type = document.getElementById('global-market-type')?.value || '';
  _mapSettings.market_name = document.getElementById('global-market-name')?.value || '';
  try { localStorage.setItem('tvnow_marketCtx', JSON.stringify(_mapSettings)); } catch(_) {}
}

function _renderMapList() {
  const c = document.getElementById('content');
  if (!_maps.length) {
    c.innerHTML = `<div class="empty-state">
      <div class="icon">⇄</div>
      <h3>No Channel Maps</h3>
      <p>Maps let you combine multiple source streams for the same channel with automatic failover.</p>
      <div style="margin-top:16px;display:flex;gap:8px;justify-content:center;flex-wrap:wrap">
        <button class="btn btn-secondary" onclick="showImportMapM3UModal()">Import M3U</button>
        <button class="btn btn-primary" onclick="showCreateMapModal()">+ New Map</button>
      </div>
    </div>`;
    return;
  }
  c.innerHTML = _maps.map(m => _renderMapCard(m)).join('');
  requestAnimationFrame(() => _loadAllEpgStrips());
}

function _renderMapCard(m) {
  const memberRows = (m.members || []).map((mb, i) => `
    <div class="map-member ${mb.enabled ? '' : 'disabled'}">
      <span class="priority-badge">${i + 1}</span>
      ${mb.logo_url ? `<img class="ch-logo" style="width:28px;height:28px;object-fit:contain;border-radius:4px" src="${esc(mb.logo_url)}" onerror="this.style.display='none'">` : '<div style="width:28px"></div>'}
      <div style="flex:1;min-width:0">
        <div style="font-size:12px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${esc(mb.name)}</div>
        <div style="font-size:11px;color:var(--muted)">${esc(mb.source_name)} &mdash; ${esc(mb.stream_type)}</div>
      </div>
      <div style="display:flex;gap:4px;align-items:center;flex-shrink:0">
        ${i > 0 ? `<button class="btn btn-sm btn-secondary btn-icon" title="Move up" onclick="mapMemberMove(${m.id},${mb.channel_id},-1)">↑</button>` : '<span style="width:28px"></span>'}
        ${i < (m.members.length - 1) ? `<button class="btn btn-sm btn-secondary btn-icon" title="Move down" onclick="mapMemberMove(${m.id},${mb.channel_id},1)">↓</button>` : '<span style="width:28px"></span>'}
        <button class="btn btn-sm btn-secondary btn-icon" title="Test stream" onclick="playChannel(${mb.channel_id})">▶</button>
        <button class="btn btn-sm btn-secondary btn-icon" style="color:var(--red)" title="Remove" onclick="mapMemberRemove(${m.id},${mb.channel_id})">✕</button>
      </div>
    </div>`).join('');

  const streamUrl = `${window.location.origin}/stream/map/${m.id}`;
  const epgBadge = m.epg_id
    ? `<span class="map-meta-badge" title="EPG ID: ${esc(m.epg_id)}">◷ ${esc(m.epg_id)}</span>`
    : `<span class="map-meta-badge muted" title="No EPG mapped">◷ No EPG</span>`;
  const logoBadge = m.logo_url
    ? `<img class="map-logo-thumb" src="${esc(m.logo_url)}" onerror="this.outerHTML='<span class=map-meta-badge>⬜ Custom URL</span>'">`
    : `<span class="map-meta-badge muted">⬜ No Logo</span>`;
  const marketBadge = (m.market_type || m.market_name)
    ? `<span class="map-meta-badge" style="background:rgba(79,127,255,.1);border-color:rgba(79,127,255,.25);color:var(--accent)">${esc(m.market_type || '')}${m.market_name ? ' · ' + esc(m.market_name) : ''}</span>`
    : '';

  return `
  <div class="card" style="margin-bottom:12px" id="map-card-${m.id}">
    <div class="card-header">
      <div style="display:flex;align-items:center;gap:10px;flex:1;min-width:0">
        <div class="map-logo-wrap" onclick="showLogoPickerModal(${m.id})" title="Change logo">
          ${m.logo_url
            ? `<img src="${esc(m.logo_url)}" style="width:44px;height:44px;object-fit:contain;border-radius:8px;display:block" onerror="this.outerHTML='<div class=map-logo-placeholder>📺</div>'">`
            : '<div class="map-logo-placeholder">📺</div>'}
          <div class="map-logo-edit-hint"></div>
        </div>
        <div style="min-width:0;flex:1">
          <div class="card-title" style="display:flex;align-items:center;gap:8px;flex-wrap:wrap">
            ${esc(m.name)}
            ${m.number ? `<span class="pill" style="font-family:'DM Mono',monospace">CH ${esc(m.number)}</span>` : ''}
            ${m.enabled ? '' : '<span class="pill" style="color:var(--muted)">Disabled</span>'}
          </div>
          <div style="display:flex;align-items:center;gap:6px;margin-top:5px;flex-wrap:wrap">
            <button class="map-meta-btn" onclick="showLogoPickerModal(${m.id})">${logoBadge}</button>
            <button class="map-meta-btn" onclick="showEpgPickerModal(${m.id})">${epgBadge}</button>
            ${m.group_name ? `<span class="map-meta-badge muted">${esc(m.group_name)}</span>` : ''}
            ${marketBadge}
          </div>
        </div>
      </div>
      <div style="display:flex;gap:6px;align-items:center;flex-shrink:0;flex-wrap:wrap;justify-content:flex-end">
        <span class="pill">${(m.members||[]).length} source${(m.members||[]).length!==1?'s':''}</span>
        <button class="btn btn-sm btn-primary" onclick="showSmartAddModal(${m.id})">+ Smart Add</button>
        <button class="btn btn-sm btn-secondary" onclick="showEditMapModal(${m.id})">Edit</button>
        <button class="btn btn-sm btn-secondary" onclick="mapToggle(${m.id})" title="${m.enabled?'Disable':'Enable'}">${m.enabled?'⏸':'▶'}</button>
        <button class="btn btn-sm btn-secondary" onclick="mapCopyUrl(${m.id})" title="Copy stream URL">⎘ URL</button>
        <button class="btn btn-sm btn-danger btn-icon" onclick="mapDelete(${m.id})" title="Delete">✕</button>
      </div>
    </div>

    <div id="epg-strip-${m.id}" class="map-epg-strip" style="display:none"></div>

    ${(m.members||[]).length ? `
      <div style="padding:0 4px 4px">
        <div style="font-size:10px;color:var(--muted);margin-bottom:6px;padding:0 8px;font-weight:600;text-transform:uppercase;letter-spacing:.5px">
          Priority Order — first source tried, failover down the list
        </div>
        <div>${memberRows}</div>
      </div>` :
      `<div style="padding:12px 16px 10px;color:var(--muted);font-size:13px">No streams yet — <button class="btn btn-sm btn-primary" onclick="showSmartAddModal(${m.id})">+ Smart Add</button> to auto-match streams.</div>`}

    <div style="padding:8px 16px 12px;border-top:1px solid var(--border);display:flex;align-items:center;gap:8px;flex-wrap:wrap">
      <span style="font-size:10px;color:var(--muted);word-break:break-all;flex:1;font-family:'DM Mono',monospace">${streamUrl}</span>
      <button class="btn btn-sm btn-secondary" onclick="playMapStream(${m.id})">▶ Test</button>
    </div>
  </div>`;
}

// ────────────────────────────────────────────────────────────────
//  SMART ADD MODAL  -- the new heart of the mapping workflow
// ────────────────────────────────────────────────────────────────
async function showSmartAddModal(mapId) {
  const m = _maps.find(x => x.id === mapId);
  if (!m) return;

  const overlayEl = document.createElement('div');
  overlayEl.className = 'modal-overlay';
  overlayEl.innerHTML = `
    <div class="modal" style="max-width:700px;width:96%;max-height:88vh;display:flex;flex-direction:column;padding:0;overflow:hidden">
      <div style="padding:18px 20px 14px;border-bottom:1px solid var(--border)">
        <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:12px">
          <div class="modal-title">Smart Stream Matching — <span style="color:var(--accent)">${esc(m.name)}</span></div>
          <button class="btn btn-icon btn-secondary" onclick="this.closest('.modal-overlay').remove()">✕</button>
        </div>
        <div style="display:grid;grid-template-columns:1fr auto auto;gap:8px;align-items:center">
          <div class="search-wrap" style="position:relative">
            <span class="search-icon" style="position:absolute;left:10px;top:50%;transform:translateY(-50%);color:var(--muted);font-size:13px;pointer-events:none">⌕</span>
            <input id="smart-search" placeholder="Search channels (e.g. Discovery, CNN, WBBM)…"
              style="width:100%;padding:8px 11px 8px 32px;border:1px solid var(--border2);border-radius:6px;background:var(--surface2);color:var(--text);font-size:13px;font-family:inherit;outline:none"
              oninput="_smartSearchDebounce(${mapId})" value="${esc(m.name)}">
          </div>
          <select id="smart-market-type"
            style="padding:7px 8px;border:1px solid var(--border2);border-radius:6px;background:var(--surface2);color:var(--text);font-size:12px;font-family:inherit"
            onchange="_smartSearch(${mapId})">
            <option value="">Any</option>
            <option value="OTA" ${_mapSettings.market_type==='OTA'?'selected':''}>OTA</option>
            <option value="SAT" ${_mapSettings.market_type==='SAT'?'selected':''}>Satellite</option>
            <option value="Cable" ${_mapSettings.market_type==='Cable'?'selected':''}>Cable</option>
          </select>
          <input id="smart-market-name" placeholder="Market" value="${esc(_mapSettings.market_name)}"
            style="width:110px;padding:7px 9px;border:1px solid var(--border2);border-radius:6px;background:var(--surface2);color:var(--text);font-size:12px;font-family:inherit"
            oninput="_smartSearchDebounce(${mapId})">
        </div>
        <div style="display:flex;align-items:center;justify-content:space-between;margin-top:8px">
          <div id="smart-epg-suggestion" style="font-size:11px;color:var(--muted)"></div>
          <div style="display:flex;gap:6px;align-items:center">
            <span id="smart-select-count" style="font-size:11px;color:var(--muted)">0 selected</span>
            <button class="btn btn-primary btn-sm" id="smart-add-btn" onclick="_smartAddSelected(${mapId})" disabled>Add Selected</button>
          </div>
        </div>
      </div>
      <div id="smart-results" style="flex:1;overflow-y:auto;padding:8px 12px"></div>
    </div>`;

  document.body.appendChild(overlayEl);
  overlayEl.addEventListener('click', e => { if (e.target === overlayEl) overlayEl.remove(); });
  overlayEl._mapId    = mapId;

  setTimeout(() => {

let _smartDebounceTimer = null;
function _smartSearchDebounce(mapId) {
  clearTimeout(_smartDebounceTimer);
  _smartDebounceTimer = setTimeout(() => _smartSearch(mapId), 300);
}

async function _smartSearch(mapId) {
  const overlayEl = document.querySelector('.modal-overlay');
  if (!overlayEl || overlayEl._mapId !== mapId) return;

  const name       = document.getElementById('smart-search')?.value?.trim() || '';
  const marketType = document.getElementById('smart-market-type')?.value || '';
  const marketName = document.getElementById('smart-market-name')?.value?.trim() || '';
  const results    = document.getElementById('smart-results');
  if (!results) return;

  if (!name) {
    results.innerHTML = `<div class="empty-state" style="padding:30px 20px"><p>Type a channel name to search…</p></div>`;
    return;
  }

  results.innerHTML = `<div style="padding:20px;text-align:center;color:var(--muted);font-size:13px">Searching…</div>`;

  try {
    const params = new URLSearchParams({ name, market_type: marketType, market_name: marketName, map_id: mapId });
    const data   = await api(`/api/channel-maps/suggest-streams?${params}`);

    // EPG suggestion banner
    const epgDiv = document.getElementById('smart-epg-suggestion');
    if (epgDiv && data.epg?.length) {
      const top = data.epg[0];
      epgDiv.innerHTML = `<span style="color:var(--text-dim)">Suggested EPG:</span> 
        <button onclick="_applyEpgSuggestion(${mapId},'${esc(top.epg_id)}')" 
          style="background:none;border:1px solid var(--border2);border-radius:5px;padding:2px 7px;cursor:pointer;color:var(--accent);font-size:11px;font-family:'DM Mono',monospace">
          ${esc(top.epg_id)}
        </button>
        <span style="color:var(--muted);font-size:10px">${top.confidence}% match</span>
        ${data.epg.length > 1 ? `<button onclick="showEpgPickerModal(${mapId})" style="background:none;border:none;cursor:pointer;color:var(--muted);font-size:11px;margin-left:4px">+${data.epg.length-1} more</button>` : ''}`;
    } else if (epgDiv) {
      epgDiv.innerHTML = '';
    }

    if (!data.streams?.length) {
      results.innerHTML = `<div class="empty-state" style="padding:30px 20px"><p>No matching streams found. Try a different search term.</p></div>`;
      return;
    }

    // Group by source
    const bySource = {};
    for (const ch of data.streams) {
      const key = ch.source_name;
      if (!bySource[key]) bySource[key] = { color: ch.source_color, channels: [] };
      bySource[key].channels.push(ch);
    }

    const selected = overlayEl._selected;

    results.innerHTML = Object.entries(bySource).map(([srcName, grp]) => `
      <div style="margin-bottom:14px">
        <div style="display:flex;align-items:center;gap:6px;margin-bottom:6px;padding:2px 0">
          <span style="width:8px;height:8px;border-radius:50%;background:${grp.color||'var(--muted)'};flex-shrink:0;display:inline-block"></span>
          <span style="font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.6px;color:var(--muted)">${esc(srcName)}</span>
          <button onclick="_selectAllFromSource('${esc(srcName)}')" style="background:none;border:none;cursor:pointer;font-size:10px;color:var(--accent);padding:0 4px;font-family:inherit">Select All</button>
        </div>
        ${grp.channels.map(ch => {
          const isSelected = selected.has(ch.id);
          const conf       = ch.confidence;
          const confColor  = conf >= 90 ? 'var(--green)' : conf >= 70 ? 'var(--amber)' : 'var(--red)';
          const confLabel  = conf >= 90 ? 'High' : conf >= 70 ? 'Review' : 'Uncertain';
          return `
          <div class="smart-candidate ${isSelected ? 'selected' : ''}" data-id="${ch.id}" data-source="${esc(ch.source_name)}" onclick="_toggleCandidate(${ch.id},${mapId})"
            style="display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:7px;border:1px solid ${isSelected ? 'var(--accent)' : 'var(--border)'};background:${isSelected ? 'var(--accent-glow)' : 'var(--surface2)'};cursor:pointer;margin-bottom:4px;transition:all .12s">
            <div style="width:18px;height:18px;border-radius:4px;border:1.5px solid ${isSelected ? 'var(--accent)' : 'var(--border2)'};background:${isSelected ? 'var(--accent)' : 'transparent'};display:flex;align-items:center;justify-content:center;flex-shrink:0;font-size:11px;color:#fff;transition:all .12s">
              ${isSelected ? '✓' : ''}
            </div>
            ${ch.logo_url ? `<img src="${esc(ch.logo_url)}" style="width:32px;height:32px;object-fit:contain;border-radius:5px;flex-shrink:0" onerror="this.style.display='none'">` : '<div style="width:32px;height:32px;border-radius:5px;background:var(--surface3);flex-shrink:0"></div>'}
            <div style="flex:1;min-width:0">
              <div style="font-size:13px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${esc(ch.name)}</div>
              <div style="font-size:11px;color:var(--muted);display:flex;gap:8px;margin-top:1px">
                <span>${esc(ch.stream_type)}</span>
                ${ch.number ? `<span>CH ${esc(ch.number)}</span>` : ''}
                ${ch.group_name ? `<span>${esc(ch.group_name)}</span>` : ''}
              </div>
            </div>
            <div style="display:flex;flex-direction:column;align-items:flex-end;gap:3px;flex-shrink:0">
              <span style="font-size:10px;font-weight:700;font-family:'DM Mono',monospace;color:${confColor}">${conf}%</span>
              <span style="font-size:9px;color:${confColor};text-transform:uppercase;letter-spacing:.4px">${confLabel}</span>
            </div>
          </div>`;
        }).join('')}
      </div>
    `).join('');

    _updateSmartCount();
  } catch (err) {
    results.innerHTML = `<div class="empty-state" style="padding:20px"><p style="color:var(--red)">${esc(err.message)}</p></div>`;
  }
}

function _toggleCandidate(channelId, mapId) {
  const overlayEl = document.querySelector('.modal-overlay');
  if (!overlayEl || overlayEl._mapId !== mapId) return;

  if (overlayEl._selected.has(channelId)) {
    overlayEl._selected.delete(channelId);
  } else {
    // Check if this is < 70% confidence -- ask for confirmation
    const el      = document.querySelector(`.smart-candidate[data-id="${channelId}"]`);
    const confTxt = el?.querySelector('[style*="DM Mono"]')?.textContent?.trim() || '100%';
    const conf    = parseInt(confTxt);
    if (conf < 70 && !overlayEl._selected.has(channelId)) {
      const chName = el?.querySelector('[style*="font-weight:600"]')?.textContent?.trim() || 'this channel';
      if (!confirm(`Match confidence is ${conf}% — this may not be the right stream.\n\nAdd "${chName}" anyway?`)) return;
    }
    overlayEl._selected.add(channelId);
  }

  // Update visual state
  const el = document.querySelector(`.smart-candidate[data-id="${channelId}"]`);
  if (el) {
    const isNowSelected = overlayEl._selected.has(channelId);
    el.style.border    = `1px solid ${isNowSelected ? 'var(--accent)' : 'var(--border)'}`;
    el.style.background = isNowSelected ? 'var(--accent-glow)' : 'var(--surface2)';
    const box = el.querySelector('div[style*="border-radius:4px"]');
    if (box) {
      box.style.border     = `1.5px solid ${isNowSelected ? 'var(--accent)' : 'var(--border2)'}`;
      box.style.background = isNowSelected ? 'var(--accent)' : 'transparent';
      box.textContent      = isNowSelected ? '✓' : '';
    }
  }
  _updateSmartCount();
}

function _selectAllFromSource(sourceName) {
  const overlayEl = document.querySelector('.modal-overlay');
  if (!overlayEl) return;
  document.querySelectorAll(`.smart-candidate[data-source="${CSS.escape(sourceName)}"]`).forEach(el => {
    const id = parseInt(el.dataset.id);
    overlayEl._selected.add(id);
    el.style.border     = '1px solid var(--accent)';
    el.style.background = 'var(--accent-glow)';
    const box = el.querySelector('div[style*="border-radius:4px"]');
    if (box) { box.style.border = '1.5px solid var(--accent)'; box.style.background = 'var(--accent)'; box.textContent = '✓'; }
  });
  _updateSmartCount();
}

function _updateSmartCount() {
  const overlayEl = document.querySelector('.modal-overlay');
  if (!overlayEl) return;
  const n = overlayEl._selected?.size || 0;
  const countEl = document.getElementById('smart-select-count');
  const addBtn  = document.getElementById('smart-add-btn');
  if (countEl) countEl.textContent = `${n} selected`;
  if (addBtn)  addBtn.disabled = n === 0;
}

async function _smartAddSelected(mapId) {
  const overlayEl = document.querySelector('.modal-overlay');
  if (!overlayEl || overlayEl._mapId !== mapId) return;
  const ids = [...(overlayEl._selected || [])];
  if (!ids.length) return;

  const btn = document.getElementById('smart-add-btn');
  if (btn) { btn.disabled = true; btn.textContent = 'Adding…'; }

  let added = 0, failed = 0;
  for (const channelId of ids) {
    try {
      await api(`/api/channel-maps/${mapId}/members`, {
        method: 'POST', body: JSON.stringify({ channel_id: channelId }),
      });
      added++;
    } catch (err) {
      if (!err.message.includes('already')) failed++;
    }
  }

  overlayEl.remove();
  toast(`Added ${added} stream${added !== 1 ? 's' : ''}${failed ? ` (${failed} failed)` : ''} to map`);
  _maps = await api('/api/channel-maps');
  _renderMapList();
  requestAnimationFrame(() => _loadAllEpgStrips());
}

async function _applyEpgSuggestion(mapId, epgId) {
  try {
    await api(`/api/channel-maps/${mapId}`, { method: 'PUT', body: JSON.stringify({ epg_id: epgId }) });
    const m = _maps.find(x => x.id === mapId);
    if (m) m.epg_id = epgId;
    toast(`EPG set to ${epgId}`);
    // Re-render just the map card
    const cardEl = document.getElementById(`map-card-${mapId}`);
    if (cardEl) cardEl.outerHTML = _renderMapCard(_maps.find(x => x.id === mapId) || {});
    // Close the smart add modal if open
    document.querySelector('.modal-overlay')?.remove();
    _maps = await api('/api/channel-maps');
    _renderMapList();
  } catch (err) { toast(err.message, 'error'); }
}

// ────────────────────────────────────────────────────────────────
//  Map member move / remove
// ────────────────────────────────────────────────────────────────
async function mapMemberMove(mapId, channelId, dir) {
  const m       = _maps.find(x => x.id === mapId);
  if (!m) return;
  const idx     = m.members.findIndex(mb => mb.channel_id === channelId);
  const newIdx  = idx + dir;
  if (newIdx < 0 || newIdx >= m.members.length) return;
  const order   = m.members.map(mb => mb.channel_id);
  order.splice(newIdx, 0, order.splice(idx, 1)[0]);
  await api(`/api/channel-maps/${mapId}/members/reorder`, { method: 'PUT', body: JSON.stringify({ order }) });
  m.members.sort((a, b) => order.indexOf(a.channel_id) - order.indexOf(b.channel_id));
  const cardEl = document.getElementById(`map-card-${mapId}`);
  if (cardEl) cardEl.outerHTML = _renderMapCard(m);
  _loadEpgStrip(mapId);
}

async function mapMemberRemove(mapId, channelId) {
  await api(`/api/channel-maps/${mapId}/members/${channelId}`, { method: 'DELETE' });
  const m = _maps.find(x => x.id === mapId);
  if (m) m.members = m.members.filter(mb => mb.channel_id !== channelId);
  const cardEl = document.getElementById(`map-card-${mapId}`);
  if (cardEl) cardEl.outerHTML = _renderMapCard(m || {});
}

function mapCopyUrl(id) {
  const url = `${window.location.origin}/stream/map/${id}`;
  navigator.clipboard.writeText(url).then(() => toast('Stream URL copied'));
}

function playMapStream(id) {
  playChannel(`map/${id}`);
}

async function mapToggle(id) {
  await api(`/api/channel-maps/${id}/toggle`, { method: 'POST' });
  const m = _maps.find(x => x.id === id);
  if (m) m.enabled = m.enabled ? 0 : 1;
  _renderMapList();
}

async function mapDelete(id) {
  const m = _maps.find(x => x.id === id);
  if (!confirm(`Delete map "${m?.name || id}"? This cannot be undone.`)) return;
  await api(`/api/channel-maps/${id}`, { method: 'DELETE' });
  _maps = _maps.filter(x => x.id !== id);
  _renderMapList();
}

let _liveHintTimer = null;
async function _liveMapNameHint() {
  clearTimeout(_liveHintTimer);
  _liveHintTimer = setTimeout(async () => {
    const name       = document.getElementById('map-name')?.value?.trim() || '';
    const marketType = document.getElementById('map-market-type')?.value || '';
    const marketName = document.getElementById('map-market-name')?.value?.trim() || '';
    const hint       = document.getElementById('map-name-hint');
    const epgHint    = document.getElementById('map-epg-hint');
    if (!name || name.length < 3) return;

    try {
      const params = new URLSearchParams({ name, market_type: marketType, market_name: marketName });
      const data   = await api(`/api/channel-maps/suggest-streams?${params}`);
      if (hint) {
        hint.innerHTML = data.streams?.length
          ? `<span style="color:var(--green)">✓ Found ${data.streams.length} potential stream${data.streams.length!==1?'s':''}</span> — you'll select them after creation`
          : `<span style="color:var(--muted)">No streams found yet — add sources first</span>`;
      }
      if (epgHint && data.epg?.length) {
        const top = data.epg[0];
        epgHint.innerHTML = `Suggested: <button onclick="document.getElementById('map-epg').value='${esc(top.epg_id)}';this.parentElement.textContent='Set to '+${jsq(top.epg_id)}" style="background:none;border:1px solid var(--border2);border-radius:4px;padding:1px 6px;cursor:pointer;color:var(--accent);font-size:10px;font-family:'DM Mono',monospace">${esc(top.epg_id)}</button> <span style="color:var(--muted)">${top.confidence}% match</span>`;
      }
    } catch (_) {}
  }, 400);
}

async function createMap() {
  const name        = document.getElementById('map-name').value.trim();
  const number      = document.getElementById('map-number').value.trim();
  const group       = document.getElementById('map-group').value.trim();
  const logo_url    = document.getElementById('map-logo').value.trim();
  const epg_id      = document.getElementById('map-epg').value.trim();
  const market_type = document.getElementById('map-market-type').value;
  const market_name = document.getElementById('map-market-name').value.trim();
  if (!name) { toast('Name is required', 'error'); return; }

  const result = await api('/api/channel-maps', {
    method: 'POST',
    body: JSON.stringify({ name, number: number||null, group_name: group||null, logo_url: logo_url||null, epg_id: epg_id||null, market_type: market_type||null, market_name: market_name||null }),
  });
  document.querySelector('.modal-overlay')?.remove();
  _maps = await api('/api/channel-maps');
  _renderMapList();

  // Immediately open Smart Add for the new map
  if (result.id) {
    // Update market context from what was entered
    if (market_type) _mapSettings.market_type = market_type;
    if (market_name) _mapSettings.market_name = market_name;
    await showSmartAddModal(result.id);
  }
}

//  EPG strip loader (unchanged from original)
// ────────────────────────────────────────────────────────────────
async function _loadEpgStrip(mapId) {
  const m = _maps.find(x => x.id === mapId);
  if (!m?.epg_id) return;
  const strip = document.getElementById(`epg-strip-${mapId}`);
  if (!strip) return;
  try {
    const now  = Math.floor(Date.now() / 1000);
    const rows = await api(`/api/epg/guide?epg_id=${encodeURIComponent(m.epg_id)}&from=${now - 600}&to=${now + 4 * 3600}`);
    if (!rows.length) { strip.style.display = 'none'; return; }
    const fmtTime = ts => new Date(ts * 1000).toLocaleTimeString([], { hour:'2-digit', minute:'2-digit' });
    strip.style.display = 'flex';
    strip.innerHTML = rows.slice(0, 6).map(r => {
      const isCurrent = r.start_time <= now && r.end_time > now;
      const pct = isCurrent ? Math.round((now - r.start_time) / (r.end_time - r.start_time) * 100) : 0;
      return `
        <div class="epg-slot ${isCurrent ? 'current' : ''}">
          <div style="font-size:10px;color:var(--muted);font-family:'DM Mono',monospace">${fmtTime(r.start_time)}</div>
          <div style="font-size:12px;font-weight:${isCurrent?600:400};white-space:nowrap;overflow:hidden;text-overflow:ellipsis" title="${esc(r.title)}">${esc(r.title)}</div>
          ${isCurrent ? `<div class="epg-progress"><div class="epg-progress-fill" style="width:${pct}%"></div></div>` : ''}
        </div>`;
    }).join('');
  } catch (_) { strip.style.display = 'none'; }
}

function _loadAllEpgStrips() {
  for (const m of _maps) {
    if (m.epg_id) _loadEpgStrip(m.id);
  }
}




async function showAddMemberModal(mapId) {
  const m = _maps.find(x => x.id === mapId);
  const [allChannels, sources] = await Promise.all([api('/api/channels'), api('/api/sources')]);
  const srcMap = {};
  for (const s of sources) srcMap[s.id] = s;
  const existingIds = new Set((m?.members || []).map(mb => mb.channel_id));

  const overlayEl = document.createElement('div');
  overlayEl.className = 'modal-overlay';
  overlayEl.innerHTML = `
    <div class="modal" style="max-width:640px;width:95%;max-height:80vh;display:flex;flex-direction:column">
      <div class="modal-header">
        <div class="modal-title"> Add Channels to "${esc(m?.name || mapId)}"</div>
        <button class="btn btn-icon btn-secondary" onclick="this.closest('.modal-overlay').remove()"></button>
      </div>
      <input id="add-member-search" class="inp" placeholder="Search channels" style="width:100%;margin-bottom:10px" oninput="_filterAddMemberList()">
      <div id="add-member-list" style="flex:1;overflow-y:auto;display:flex;flex-direction:column;gap:2px"></div>
    </div>`;
  document.body.appendChild(overlayEl);
  overlayEl.addEventListener('click', e => { if (e.target === overlayEl) overlayEl.remove(); });

  overlayEl._allChannels = allChannels;
  overlayEl._existingIds = existingIds;
  overlayEl._srcMap      = srcMap;
  overlayEl._mapId       = mapId;

  _filterAddMemberList();
  setTimeout(() => document.getElementById('add-member-search')?.focus(), 50);
}

function _filterAddMemberList() {
  const overlayEl = document.querySelector('.modal-overlay');
  if (!overlayEl?._allChannels) return;
  const { _allChannels, _existingIds, _srcMap, _mapId } = overlayEl;
  const q = (document.getElementById('add-member-search')?.value || '').toLowerCase();

  const filtered = _allChannels.filter(ch => {
    const src = _srcMap[ch.source_id];
    return !q || `${ch.name} ${src?.name||''} ${ch.group_name||''}`.toLowerCase().includes(q);
  });

  const list = document.getElementById('add-member-list');
  if (!list) return;

  if (!filtered.length) {
    list.innerHTML = '<div style="color:var(--muted);font-size:12px;padding:8px">No channels found</div>';
    return;
  }

  const bySource = {};
  for (const ch of filtered) {
    const key = _srcMap[ch.source_id]?.name || 'Unknown';
    if (!bySource[key]) bySource[key] = [];
    bySource[key].push(ch);
  }

  list.innerHTML = Object.entries(bySource).map(([srcName, chs]) => `
    <div style="margin-bottom:10px">
      <div style="font-size:11px;color:var(--muted);font-weight:600;padding:4px 2px 6px;text-transform:uppercase;letter-spacing:.5px">${esc(srcName)}</div>
      ${chs.map(ch => {
        const already = _existingIds.has(ch.id);
        return `
          <div class="map-member" style="opacity:${already?'.5':'1'}">
            ${ch.logo_url ? `<img style="width:28px;height:28px;object-fit:contain;border-radius:4px" src="${esc(ch.logo_url)}" onerror="this.style.display='none'">` : '<div style="width:28px"></div>'}
            <div style="flex:1;min-width:0">
              <div style="font-size:12px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${esc(ch.name)}</div>
              <div style="font-size:11px;color:var(--muted)">${ch.number?`CH ${esc(ch.number)} - `:''}${esc(ch.stream_type)}</div>
            </div>
            <button class="btn btn-sm ${already?'btn-secondary':'btn-primary'}" ${already?'disabled':''} onclick="_addMember(${_mapId},${ch.id},this)">
              ${already ? 'Added' : ' Add'}
            </button>
          </div>`;
      }).join('')}
    </div>`).join('');
}

async function _addMember(mapId, channelId, btn) {
  btn.disabled = true; btn.textContent = '';
  try {
    await api(`/api/channel-maps/${mapId}/members`, {
      method: 'POST', body: JSON.stringify({ channel_id: channelId }),
    });
    btn.textContent = 'Added';
    btn.className = 'btn btn-sm btn-secondary';

    const overlayEl = document.querySelector('.modal-overlay');
    if (overlayEl?._existingIds) overlayEl._existingIds.add(channelId);

    // Refresh local map state
    _maps = await api('/api/channel-maps');
    toast('Channel added to map');
  } catch (err) {
    btn.disabled = false; btn.textContent = ' Add';
    toast(err.message || 'Failed to add', 'error');
  }
}

let _epgSearchTimer = null;
function _filterEpgList(mapId) {
  clearTimeout(_epgSearchTimer);
  _epgSearchTimer = setTimeout(async () => {
    const q       = (document.getElementById('epg-search')?.value || '').trim();
    const results = document.getElementById('epg-search-results');
    if (!results) return;
    const m = _maps.find(x => x.id === mapId);

    results.innerHTML = '<div style="color:var(--muted);font-size:12px;padding:8px">Loading</div>';

    try {
      const rows = await api(`/api/epg/ids?q=${encodeURIComponent(q)}&limit=40`);
      if (!rows.length) {
        results.innerHTML = '<div style="color:var(--muted);font-size:12px;padding:8px">No matching EPG IDs found</div>';
        return;
      }
      const fmtTime = ts => ts ? new Date(ts * 1000).toLocaleTimeString([], { hour:'2-digit', minute:'2-digit' }) : '';
      results.innerHTML = rows.map(r => {
        const isCurrent = m?.epg_id === r.epg_id;
        const nowText   = r.now_title  ? `<span style="color:var(--green)">- ${esc(r.now_title)} (${fmtTime(r.now_start)}${fmtTime(r.now_end)})</span>` : '';
        const nextText  = r.next_title ? `<span style="color:var(--muted)">Next: ${esc(r.next_title)} @ ${fmtTime(r.next_start)}</span>` : '';
        return `
          <div class="epg-result-row ${isCurrent ? 'active' : ''}" onclick='_setMapEpg(${mapId}, ${jsq(r.epg_id)})'>
            <div style="flex:1;min-width:0">
              <div style="font-size:13px;font-weight:${isCurrent?700:500}">${esc(r.epg_id)}</div>
              <div style="display:flex;flex-direction:column;gap:2px;margin-top:2px">
                ${nowText}
                ${nextText}
              </div>
            </div>
            <div style="display:flex;flex-direction:column;align-items:flex-end;gap:2px;flex-shrink:0">
              <span style="font-size:10px;color:var(--muted)">${r.program_count} programs</span>
              ${isCurrent ? '<span style="font-size:10px;color:var(--accent);font-weight:700"> Selected</span>' : ''}
            </div>
          </div>`;
      }).join('');
    } catch (err) {
      results.innerHTML = `<div style="color:var(--red);font-size:12px;padding:8px">${esc(err.message)}</div>`;
    }
  }, 220);
}

async function _setMapEpg(mapId, epgId) {
  await api(`/api/channel-maps/${mapId}`, {
    method: 'PUT',
    body: JSON.stringify({ epg_id: epgId }),
  });
  const m = _maps.find(x => x.id === mapId);
  if (m) m.epg_id = epgId;
  document.querySelector('.modal-overlay')?.remove();
  _renderMapList();
  toast(epgId ? `EPG set to ${epgId}` : 'EPG cleared');
}
