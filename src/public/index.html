  // Collect logos from member channels (deduplicated)
  const memberLogos = [...new Map(
    (m?.members || []).filter(mb => mb.logo_url).map(mb => [mb.logo_url, { url: mb.logo_url, name: mb.name }])
  ).values()];

  const overlayEl = document.createElement('div');
  overlayEl.className = 'modal-overlay';
  overlayEl.innerHTML = `
    <div class="modal" style="max-width:580px;width:95%">
      <div class="modal-header">
        <div class="modal-title">- Logo Mapping  ${esc(m?.name || mapId)}</div>
        <button class="btn btn-icon btn-secondary" onclick="this.closest('.modal-overlay').remove()"></button>
      </div>

      ${memberLogos.length ? `
        <div style="margin-bottom:16px">
          <div style="font-size:11px;color:var(--muted);margin-bottom:8px;font-weight:600;text-transform:uppercase;letter-spacing:.5px">From member channels</div>
          <div style="display:flex;flex-wrap:wrap;gap:10px">
            ${memberLogos.map(lg => `
              <button class="logo-pick-btn ${m?.logo_url===lg.url?'active':''}"
                onclick='_setMapLogo(${mapId}, ${jsq(lg.url)})'>
                <img src="${esc(lg.url)}" title="${esc(lg.name)}"
                  onerror="this.parentElement.style.display='none'"
                  style="width:56px;height:56px;object-fit:contain;display:block">
                <div style="font-size:10px;color:var(--muted);margin-top:3px;max-width:64px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${esc(lg.name)}</div>
              </button>`).join('')}
          </div>
        </div>` : ''}

      <div style="margin-bottom:12px">
        <label style="font-size:12px;color:var(--muted);display:block;margin-bottom:6px;font-weight:600;text-transform:uppercase;letter-spacing:.5px">Custom URL</label>
        <div style="display:flex;gap:8px;align-items:center">
          <input id="logo-url-input" class="inp" placeholder="https:///logo.png" style="flex:1"
            value="${esc(m?.logo_url||'')}" oninput="_previewLogoUrl()">
          <button class="btn btn-secondary" onclick="_applyCustomLogo(${mapId})">Apply</button>
        </div>
        <div id="logo-url-preview" style="margin-top:10px;display:flex;align-items:center;gap:10px;min-height:40px">
          ${m?.logo_url ? `<img src="${esc(m.logo_url)}" id="logo-preview-img" style="width:64px;height:64px;object-fit:contain;border-radius:6px;border:1px solid var(--border)" onerror="this.style.opacity='.3'">
          <span style="font-size:11px;color:var(--muted)">Current logo</span>` : ''}
        </div>
      </div>

      <div class="modal-footer">
        ${m?.logo_url ? `<button class="btn btn-secondary" style="color:var(--red)" onclick="_setMapLogo(${mapId}, null)"> Clear Logo</button>` : ''}
        <button class="btn btn-secondary" onclick="this.closest('.modal-overlay').remove()">Done</button>
      </div>
    </div>`;
  document.body.appendChild(overlayEl);
  overlayEl.addEventListener('click', e => { if (e.target === overlayEl) overlayEl.remove(); });
  setTimeout(() => document.getElementById('logo-url-input')?.focus(), 50);
}

function _previewLogoUrl() {
  const url = document.getElementById('logo-url-input')?.value.trim();
  const preview = document.getElementById('logo-url-preview');
  if (!preview) return;
  if (!url) { preview.innerHTML = ''; return; }
  preview.innerHTML = `<img src="${esc(url)}" id="logo-preview-img"
    style="width:64px;height:64px;object-fit:contain;border-radius:6px;border:1px solid var(--border)"
    onerror="this.style.opacity='.3'">
    <span style="font-size:11px;color:var(--muted)">Preview</span>`;
}

async function _applyCustomLogo(mapId) {
  const url = document.getElementById('logo-url-input')?.value.trim();
  await _setMapLogo(mapId, url || null);
}

async function _setMapLogo(mapId, logoUrl) {
  await api(`/api/channel-maps/${mapId}`, {
    method: 'PUT',
    body: JSON.stringify({ logo_url: logoUrl }),
  });
  const m = _maps.find(x => x.id === mapId);
  if (m) m.logo_url = logoUrl;
  document.querySelector('.modal-overlay')?.remove();
  _renderMapList();
  toast(logoUrl ? 'Logo updated' : 'Logo cleared');
}

      </label>
      <input type="range" id="dedup-threshold" min="0" max="40" step="1" value="0"
             style="width:100%;accent-color:var(--accent)"
             oninput="_updateThresholdLabel(this.value)" />
      <p style="color:var(--muted);font-size:11px;margin-top:4px">
        0 = exact &nbsp;-&nbsp; 10 = catches "CNN HD" vs "CNN" &nbsp;-&nbsp; 20 = moderate fuzzy &nbsp;-&nbsp; 40 = aggressive
      </p>
    </div>
    <div class="modal-footer">
      <button class="btn btn-secondary" onclick="this.closest('.modal-overlay').remove()">Cancel</button>
      <button class="btn btn-danger" onclick="runDedup()"> Remove Duplicates</button>
    </div>
  `);
  _initDedupDrag();
}

function _initDedupDrag() {
  const list = document.getElementById('dedup-source-list');
  if (!list) return;
  let dragging = null;
  list.querySelectorAll('.dedup-src-row').forEach(row => {
    row.addEventListener('dragstart', e => { dragging = row; row.style.opacity = '0.4'; });
    row.addEventListener('dragend',   e => { dragging = null; row.style.opacity = '1'; });
    row.addEventListener('dragover',  e => {
      e.preventDefault();
      const after = [...list.querySelectorAll('.dedup-src-row:not([style*="opacity: 0.4"])')].find(r => {
        const box = r.getBoundingClientRect();
        return e.clientY < box.top + box.height / 2;
      });
      list.insertBefore(dragging, after || null);
    });
  });
}

function _updateThresholdLabel(val) {
  val = parseInt(val);
  const labels = { 0: '0  Exact match', 5: '5  Near-exact', 10: '10  Catches "CNN HD" vs "CNN"', 20: '20  Moderate fuzzy', 30: '30  Loose', 40: '40  Aggressive' };
  const lbl = labels[val] !== undefined ? labels[val] : `${val}`;
  document.getElementById('dedup-threshold-val').textContent = lbl;
}

async function runDedup() {
  const list      = document.getElementById('dedup-source-list');
  const scope     = document.getElementById('dedup-scope')?.value || 'name';
  const tolerance = parseInt(document.getElementById('dedup-threshold')?.value || '0', 10);
  if (!list) return;
  const orderedIds = [...list.querySelectorAll('.dedup-src-row')].map(r => parseInt(r.dataset.id));
  try {
    const res = await api('/api/sources/dedup-ranked', {
      method: 'POST',
      body: JSON.stringify({ source_order: orderedIds, scope, tolerance }),
    });
    toast(`Removed ${res.removed} duplicate channel(s)`);
    document.querySelector('.modal-overlay')?.remove();
    _channels = await api('/api/channels');
    filterChannels();
  } catch(e) { toast(e.message, 'error'); }
}

  return `<tr id="src-row-${s.id}">
    <td>
      <div style="display:flex;align-items:center;gap:8px">
        <span style="width:10px;height:10px;border-radius:50%;background:${color};flex-shrink:0;display:inline-block"></span>

    </td>
    <td><span class="pill" style="font-family:'DM Mono',monospace">${esc(s.type)}</span></td>
    <td style="color:var(--text-dim);font-size:12px;font-family:'DM Mono',monospace">${(s.max_streams > 0) ? s.max_streams : '<span style="color:var(--muted)">inf</span>'}</td>

        <button class="btn btn-sm btn-danger" onclick="deleteSource(${s.id})">Delete</button>

async function saveEditSource(id) {
  const s             = _sources.find(x => x.id === id);
  const name          = document.getElementById('edit-name')?.value?.trim();
  const max_streams   = parseInt(document.getElementById('edit-max-streams')?.value || '0');
  const color         = document.getElementById('edit-color')?.value || null;
  const epg_raw       = document.getElementById('edit-epg-source')?.value;
  const epg_source_id = epg_raw ? parseInt(epg_raw) : null;
  const enabled       = parseInt(document.getElementById('edit-enabled')?.value ?? '1');
  if (!name) return toast('Name required', 'error');

  // Merge configFields values on top of existing config
  let config = null;
  const plugin = (_pluginTypes || []).find(p => p.type === s?.type);
  if (plugin?.configFields?.length) {
    let base = {};
    try { base = JSON.parse(s?.config || '{}'); } catch(_) {}
    config = { ...base, ..._buildConfigFromFields(plugin.configFields, 'edit-cfg-field-') };
  }

  try {
    const body = { name, max_streams, color, epg_source_id, enabled };
    if (config !== null) body.config = JSON.stringify(config);
    await api(`/api/sources/${id}`, { method: 'PUT', body: JSON.stringify(body) });
    toast('Source updated');
    document.querySelector('.modal-overlay')?.remove();
    refreshCurrentPage();
  } catch(err) { toast(err.message, 'error'); }
}

function _renderConfigFieldsHtml(fields, existingConfig, prefix) {
  return fields.map(f => {
    const val = existingConfig ? (existingConfig[f.key] ?? '') : '';
    const inputType = f.type === 'password' ? 'password' : f.type === 'number' ? 'number' : 'text';
    return `<div class="form-group">
      <label>${esc(f.label)}</label>
      <input id="${prefix}${esc(f.key)}"
             type="${inputType}"
             placeholder="${esc(f.placeholder || '')}"
             value="${esc(String(val))}"
             ${f.required ? 'required' : ''} />
      ${f.hint ? `<p style="color:var(--muted);font-size:11px;margin-top:4px">${esc(f.hint)}</p>` : ''}
    </div>`;
  }).join('');
}

function _buildConfigFromFields(fields, prefix) {
  const cfg = {};
  for (const f of fields) {
    const el  = document.getElementById(`${prefix}${f.key}`);
    const val = el ? el.value.trim() : '';
    if (val !== '') cfg[f.key] = f.type === 'number' ? Number(val) : val;
  }
  return cfg;
}

function updateConfigFields() {
  const type = document.getElementById('add-type')?.value;
  const wrap = document.getElementById('add-config-fields');
  if (!wrap || !type) return;

  const plugin = (_pluginTypes || []).find(p => p.type === type);
  if (plugin?.configFields?.length) {
    wrap.innerHTML = _renderConfigFieldsHtml(plugin.configFields, null, 'cfg-field-');
    return;
  }

  // Legacy hardcoded fields for built-in types
  const fields = {

async function addSource() {
  const type          = document.getElementById('add-type')?.value;
  const name          = document.getElementById('add-name')?.value?.trim();
  const max_streams   = parseInt(document.getElementById('add-max-streams')?.value || '0');
  const color         = document.getElementById('add-color')?.value || null;
  const epg_raw       = document.getElementById('add-epg-source')?.value;
  const epg_source_id = epg_raw ? parseInt(epg_raw) : null;

  if (!name) return toast('Name required', 'error');

  let config = {};
  try {
    const plugin = (_pluginTypes || []).find(p => p.type === type);
    if (plugin?.configFields?.length) {
      config = _buildConfigFromFields(plugin.configFields, 'cfg-field-');
    } else if (type === 'm3u')           config = { url: document.getElementById('cfg-url')?.value?.trim() };
    else if (type === 'hdhr')     config = { base_url: document.getElementById('cfg-base_url')?.value?.trim() };
    else if (type === 'localnow') config = { zip: document.getElementById('cfg-zip')?.value?.trim() || '10001' };
    else if (type === 'philo')    config = { email: document.getElementById('cfg-email')?.value?.trim(), channels: [] };
    else if (type === 'manual' || type === 'tve') config = { channels: JSON.parse(document.getElementById('cfg-channels')?.value || '[]') };
    else                          config = JSON.parse(document.getElementById('cfg-raw')?.value || '{}');
  } catch(e) { return toast('Invalid config JSON', 'error'); }

  const btn = document.getElementById('add-source-btn');
  if (btn) { btn.disabled = true; btn.textContent = 'Adding'; }

  try {
    const res = await api('/api/sources', { method: 'POST', body: JSON.stringify({ name, type, config, max_streams, color, epg_source_id }) });
    if (res.warning) {
      toast(`Added "${name}" with warning: ${res.warning}`, 'error');
    } else {
      toast(`Added "${name}"  ${res.channels_imported ?? 0} channels imported`);
    }
    document.querySelector('.modal-overlay')?.remove();
    refreshCurrentPage();
  } catch(err) {
    toast(err.message, 'error');
    if (btn) { btn.disabled = false; btn.textContent = 'Add Source'; }
  }
}

async function philoSendCode(sourceId) {
  const ident = document.getElementById('pair-ident')?.value?.trim();
  if (!ident) return toast('Email or phone required', 'error');

  const btn    = document.getElementById('pair-send-btn');
  const status = document.getElementById('pair-status');
  btn.textContent = 'Opening Philo';
  btn.disabled = true;
  status.style.display = 'block';
  status.style.background = 'var(--muted-bg, #f8f9fa)';
  status.style.color = 'var(--muted)';
  status.textContent = 'Opening Philo login page';

  try {
    await api('/api/philo/send_code', { method: 'POST', body: JSON.stringify({ ident }) });

    // Poll /send_code/status until awaiting_code or error
    let polls = 0;
    const iv = setInterval(async () => {
      polls++;
      const s = await api('/api/philo/send_code/status').catch(() => ({}));

      if (s.state === 'sending') {
        status.textContent = s.message || 'Opening Philo login page';

      } else if (s.state === 'awaiting_code' || s.state === 'done_auth') {
        clearInterval(iv);
        if (s.state === 'done_auth') {
          // Already authenticated  go straight to verify with empty code
          await philoDoVerify(sourceId, '');
        } else {
          document.getElementById('pair-step-1').style.display = 'none';
          document.getElementById('pair-step-2').style.display = '';
          setTimeout(() => document.getElementById('pair-code')?.focus(), 50);
        }

      } else if (s.state === 'error') {
        clearInterval(iv);
        status.style.background = 'var(--danger-bg, #f8d7da)';
        status.style.color = 'var(--danger, #721c24)';
        status.textContent = '- ' + (s.message || 'Unknown error');
        btn.textContent = 'Send Code';
        btn.disabled = false;

      } else if (polls > 60) {
        clearInterval(iv);
        status.textContent = '- Timed out waiting for browser';
        btn.textContent = 'Send Code';
        btn.disabled = false;
      }
    }, 2000);

  } catch(err) {
    status.style.background = 'var(--danger-bg, #f8d7da)';
    status.style.color = 'var(--danger, #721c24)';
    status.textContent = '- ' + err.message;
    btn.textContent = 'Send Code';
    btn.disabled = false;
  }
}

function philoPairingBack() {
  document.getElementById('pair-step-1').style.display = '';
  document.getElementById('pair-step-2').style.display = 'none';
  document.getElementById('pair-status').style.display = 'none';
  const btn = document.getElementById('pair-send-btn');
  if (btn) { btn.disabled = false; btn.textContent = 'Send Code'; }
}

async function philoVerifyCode(sourceId) {
  const code = document.getElementById('pair-code')?.value?.trim();
  if (!code) return toast('Enter the verification code', 'error');
  await philoDoVerify(sourceId, code);
}

async function philoDoVerify(sourceId, code) {
  const ident = document.getElementById('pair-ident')?.value?.trim();
  const status2 = document.getElementById('pair-status-2') || document.getElementById('pair-status');
  if (status2) {
    status2.style.display = 'block';
    status2.style.background = 'var(--muted-bg, #f8f9fa)';
    status2.style.color = 'var(--muted)';
    status2.textContent = 'Verifying';
  }
  try {
    const res = await api('/api/philo/verify_code', {
      method: 'POST',
      body: JSON.stringify({ code, source_id: sourceId, ident }),
    });
    if (status2) {
      status2.style.background = 'var(--success-bg, #d4edda)';
      status2.style.color = 'var(--success, #155724)';
      status2.textContent = ` Signed in as ${res.user}    ${res.channels_count ?? 0} channels imported.`;
    }
    setTimeout(() => { document.querySelector('.modal-overlay')?.remove(); refreshCurrentPage(); }, 1500);
  } catch(err) {
    if (status2) {
      status2.style.background = 'var(--danger-bg, #f8d7da)';
      status2.style.color = 'var(--danger, #721c24)';
      status2.textContent = '- ' + err.message;
    }
  }
}

async function setEpgRefreshHours(id, val) {
  const hours = Math.max(1, Math.min(168, parseInt(val, 10) || 6));
  try {
    await api(`/api/epg/sources/${id}`, { method: 'PATCH', body: JSON.stringify({ refresh_hours: hours }) });
    await api(`/api/epg/sources/${id}/reschedule`, { method: 'POST' }).catch(() => {});
    toast(`Refresh interval updated to ${hours}h`);
  } catch(e) { toast(e.message, 'error'); }
}

async function refreshEpgAndChannels(id) {
  toast('Refreshing EPG and channels');
  try {
    const [epgRes] = await Promise.all([
      api(`/api/epg/sources/${id}/refresh`, { method: 'POST' }),
    ]);
    // Also re-sync any sources that use this EPG source
    const linked = _sources.filter(s => s.epg_source_id === id);
    for (const src of linked) {
      try { await api(`/api/sources/${src.id}/sync`, { method: 'POST' }); } catch(_) {}
    }
    toast(`Fetched ${epgRes.programs} programs` + (linked.length ? ` - refreshed ${linked.length} source(s)` : ''));
    _channels = await api('/api/channels');
    renderEpgSources();
  } catch(err) { toast(err.message, 'error'); }
}

async function renderStreamHealth() {
  const tb = document.getElementById('topbar-actions');
  tb.innerHTML = `<button class="btn btn-secondary" onclick="renderStreamHealth()"> Refresh</button>`;
  const c = document.getElementById('content');

  let active = { active_streams: 0, channels: [] }, top = [], stats = [];
  try { active = await api('/api/stream-health/active'); } catch(_) {}
  try { top    = await api('/api/stream-health/top-channels?days=7&limit=10'); } catch(_) {}
  try { stats  = await api('/api/stream-health/stats?days=7'); } catch(_) {}

  // Build per-channel daily aggregates for a simple sparkline-style view
  const byChannel = {};
  for (const r of stats) {
    if (!byChannel[r.channel_id]) byChannel[r.channel_id] = { name: r.channel_name, rows: [] };
    byChannel[r.channel_id].rows.push(r);
  }

  c.innerHTML = `
    <div class="card">
      <div class="card-title">Live Streams</div>
      <div class="health-live-count">${active.active_streams}</div>
      ${active.channels.length ? `
        <table style="margin-top:10px">
          <thead><tr>
            <th>Channel</th>
            <th style="text-align:right">Viewers</th>
          </tr></thead>
          <tbody>${active.channels.map(a => `<tr>
            <td>${esc(a.channel_name)}</td>
            <td style="text-align:right;font-weight:700;font-family:'DM Mono',monospace">${a.viewers}</td>
          </tr>`).join('')}</tbody>
        </table>` : '<p style="color:var(--muted);font-size:13px;margin-top:8px">No active streams right now.</p>'}
    </div>

    <div class="card">
      <div class="card-title">Top Channels — Last 7 Days</div>
      ${top.length ? `
        <table style="width:100%;font-size:13px;border-collapse:collapse;margin-top:8px">
          <thead><tr style="color:var(--muted);font-size:11px;text-transform:uppercase">
            <th style="text-align:left;padding:4px 8px 4px 0">Channel</th>
            <th style="text-align:right;padding:4px 4px">Starts</th>
            <th style="text-align:right;padding:4px 4px">Watch Time</th>
            <th style="text-align:right;padding:4px 0">Errors</th>
          </tr></thead>
          <tbody>${top.map(r => `<tr>
            <td style="font-weight:500">${esc(r.channel_name || `ch#${r.channel_id}`)}</td>
            <td style="text-align:right;font-family:'DM Mono',monospace">${r.total_starts}</td>
            <td style="text-align:right;color:var(--muted);font-family:'DM Mono',monospace">${_fmtWatchTime(r.total_watch_seconds)}</td>
            <td style="text-align:right;font-family:'DM Mono',monospace;${r.total_errors > 0 ? 'color:var(--red);font-weight:600' : 'color:var(--muted)'}">${r.total_errors}</td>
          </tr>`).join('')}</tbody>
        </table>` : '<p style="color:var(--muted);font-size:13px;margin-top:8px">No data yet  streams will appear here once channels have been watched.</p>'}
    </div>

    <div class="card" style="display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:8px">
      <div>
        <div class="card-title" style="margin-bottom:4px"> Purge Old Events</div>
        <div style="font-size:12px;color:var(--muted)">Delete raw stream events older than N days (stats aggregates are kept)</div>
      </div>
      <div style="display:flex;align-items:center;gap:8px">
        <input type="number" id="health-purge-days" value="30" min="1" max="365"
          style="width:64px;padding:5px 8px;border:1px solid var(--border);border-radius:6px;background:var(--surface);color:var(--text);font-size:13px;text-align:center" />
        <span style="font-size:12px;color:var(--muted)">days</span>
        <button class="btn btn-secondary" onclick="healthPurge()">Purge</button>
      </div>
    </div>
  `;
}

function _fmtWatchTime(secs) {
  if (!secs) return '';
  const h = Math.floor(secs / 3600);
  const m = Math.floor((secs % 3600) / 60);
  if (h > 0) return `${h}h ${m}m`;
  return `${m}m`;
}

async function healthPurge() {
  const days = parseInt(document.getElementById('health-purge-days')?.value || '30');
  try {
    const r = await api(`/api/stream-health/events?keep_days=${days}`, { method: 'DELETE' });
    toast(`Purged ${r.deleted} event(s)`);
  } catch(e) { toast(e.message, 'error'); }
}

                  </div>
                  <div style="font-size:12px;color:var(--muted);font-family:monospace;word-break:break-all">${esc(h.url)}</div>
                  <div style="font-size:11px;color:var(--muted);margin-top:4px">
                    Events: <span style="color:var(--text)">${esc(h.events)}</span>
                    ${h.last_fired ? ` &nbsp;-&nbsp; Last fired: ${new Date(h.last_fired+'Z').toLocaleString()} (HTTP ${h.last_status||'?'})` : ''}
                  </div>
                </div>
                <div style="display:flex;gap:6px;flex-shrink:0">
                  <button class="btn btn-sm btn-secondary" onclick="testWebhook(${h.id})" title="Send test payload"> Test</button>
                  <button class="btn btn-sm btn-secondary" onclick="toggleWebhook(${h.id})">${h.enabled ? 'Disable' : 'Enable'}</button>
                  <button class="btn btn-sm btn-secondary" onclick="showEditWebhookModal(${h.id})"></button>
                  <button class="btn btn-sm btn-danger" onclick="deleteWebhook(${h.id})"></button>
                </div>
              </div>
            </div>`).join('')}
        </div>`}
    </div>

    <div class="card">
      <div class="card-title" style="margin-bottom:8px"> Payload Format</div>
      <pre style="background:var(--surface2);padding:12px;border-radius:8px;font-size:12px;overflow:auto;margin:0">{
  "event": "stream.start",
  "ts": "2025-01-15T10:30:00.000Z",
  "channel_id": 42,
  "channel_name": "CNN",
  "source_id": 1,
  "detail": {}
}</pre>
      <p style="color:var(--muted);font-size:12px;margin-top:8px">
        If a secret is set, it is sent as the <code>X-TVNow-Secret</code> header. Failed deliveries retry up to 3 times with 5-second delays.
      </p>
    </div>
  `;
}

function showCreateWebhookModal() {
  modal(`
    <div class="modal-header"><div class="modal-title"> New Webhook</div></div>
    <div style="display:grid;gap:12px;margin-top:8px">
      <div><label style="font-size:12px;color:var(--muted)">Name *</label>
        <input id="wh-name" type="text" placeholder="e.g. Discord Alerts" style="width:100%;margin-top:4px;padding:7px 10px;border:1px solid var(--border);border-radius:6px;background:var(--surface);color:var(--text);font-size:13px;box-sizing:border-box" /></div>
      <div><label style="font-size:12px;color:var(--muted)">URL *</label>
        <input id="wh-url" type="url" placeholder="https://hooks.example.com/..." style="width:100%;margin-top:4px;padding:7px 10px;border:1px solid var(--border);border-radius:6px;background:var(--surface);color:var(--text);font-size:13px;box-sizing:border-box" /></div>
      <div><label style="font-size:12px;color:var(--muted)">Events (comma-separated, or * for all)</label>
        <input id="wh-events" type="text" value="*" style="width:100%;margin-top:4px;padding:7px 10px;border:1px solid var(--border);border-radius:6px;background:var(--surface);color:var(--text);font-size:13px;box-sizing:border-box" /></div>
      <div><label style="font-size:12px;color:var(--muted)">Secret (optional)</label>
        <input id="wh-secret" type="text" placeholder="Sent as X-TVNow-Secret header" style="width:100%;margin-top:4px;padding:7px 10px;border:1px solid var(--border);border-radius:6px;background:var(--surface);color:var(--text);font-size:13px;box-sizing:border-box" /></div>
    </div>
    <div class="modal-footer">
      <button class="btn btn-secondary" onclick="this.closest('.modal-overlay').remove()">Cancel</button>
      <button class="btn btn-primary" onclick="saveNewWebhook()">Save</button>
    </div>
  `);
}

async function saveNewWebhook() {
  const body = {
    name:   document.getElementById('wh-name').value.trim(),
    url:    document.getElementById('wh-url').value.trim(),
    events: document.getElementById('wh-events').value.trim() || '*',
    secret: document.getElementById('wh-secret').value.trim() || null,
  };
  if (!body.name || !body.url) return toast('Name and URL are required', 'error');
  try {
    await api('/api/webhooks', { method: 'POST', body: JSON.stringify(body) });
    document.querySelector('.modal-overlay')?.remove();
    toast('Webhook created');
    renderWebhooks();
  } catch(e) { toast(e.message, 'error'); }
}

async function showEditWebhookModal(id) {
  let hooks = [];
  try { hooks = await api('/api/webhooks'); } catch(e) { return toast(e.message,'error'); }
  const h = hooks.find(x => x.id === id);
  if (!h) return toast('Not found','error');
  modal(`
    <div class="modal-header"><div class="modal-title"> Edit: ${esc(h.name)}</div></div>
    <div style="display:grid;gap:12px;margin-top:8px">
      <div><label style="font-size:12px;color:var(--muted)">Name</label>
        <input id="wh-name" type="text" value="${esc(h.name)}" style="width:100%;margin-top:4px;padding:7px 10px;border:1px solid var(--border);border-radius:6px;background:var(--surface);color:var(--text);font-size:13px;box-sizing:border-box" /></div>
      <div><label style="font-size:12px;color:var(--muted)">URL</label>
        <input id="wh-url" type="url" value="${esc(h.url)}" style="width:100%;margin-top:4px;padding:7px 10px;border:1px solid var(--border);border-radius:6px;background:var(--surface);color:var(--text);font-size:13px;box-sizing:border-box" /></div>
      <div><label style="font-size:12px;color:var(--muted)">Events</label>
        <input id="wh-events" type="text" value="${esc(h.events)}" style="width:100%;margin-top:4px;padding:7px 10px;border:1px solid var(--border);border-radius:6px;background:var(--surface);color:var(--text);font-size:13px;box-sizing:border-box" /></div>
      <div><label style="font-size:12px;color:var(--muted)">Secret</label>
        <input id="wh-secret" type="text" value="${esc(h.secret||'')}" style="width:100%;margin-top:4px;padding:7px 10px;border:1px solid var(--border);border-radius:6px;background:var(--surface);color:var(--text);font-size:13px;box-sizing:border-box" /></div>
    </div>
    <div class="modal-footer">
      <button class="btn btn-secondary" onclick="this.closest('.modal-overlay').remove()">Cancel</button>
      <button class="btn btn-primary" onclick="updateWebhook(${id})">Save</button>
    </div>
  `);
}

async function updateWebhook(id) {
  const body = {
    name:   document.getElementById('wh-name').value.trim(),
    url:    document.getElementById('wh-url').value.trim(),
    events: document.getElementById('wh-events').value.trim(),
    secret: document.getElementById('wh-secret').value.trim() || null,
  };
  try {
    await api(`/api/webhooks/${id}`, { method: 'PUT', body: JSON.stringify(body) });
    document.querySelector('.modal-overlay')?.remove();
    toast('Webhook updated');
    renderWebhooks();
  } catch(e) { toast(e.message, 'error'); }
}

async function deleteWebhook(id) {
  if (!confirm('Delete this webhook?')) return;
  try { await api(`/api/webhooks/${id}`, { method: 'DELETE' }); toast('Deleted'); renderWebhooks(); }
  catch(e) { toast(e.message, 'error'); }
}

async function toggleWebhook(id) {
  try { await api(`/api/webhooks/${id}/toggle`, { method: 'POST' }); renderWebhooks(); }
  catch(e) { toast(e.message, 'error'); }
}

async function testWebhook(id) {
  try {
    await api(`/api/webhooks/${id}/test`, { method: 'POST' });
    toast('Test payload dispatched');
  } catch(e) { toast(e.message, 'error'); }
}

// 
//  User Management
// 
async function renderUsers() {
  const tb = document.getElementById('topbar-actions');
  tb.innerHTML = `<button class="btn btn-primary" onclick="showCreateUserModal()"> New User</button>`;
  const c = document.getElementById('content');

  let users = [], me = null;
  try { users = await api('/api/users'); } catch(e) {
    if (e.message.includes('401') || e.message.includes('403')) {
      c.innerHTML = `<div class="card"><p style="color:var(--muted)"> No users exist yet  TVNow is in open-access mode. Create the first admin account to enable authentication.</p>
        <button class="btn btn-primary" style="margin-top:12px" onclick="showCreateUserModal()"> Create First Admin</button></div>`;
      return;
    }
  }
  try { me = await api('/api/auth/me'); } catch(_) {}

  const openAccess = me?.open_access;

  c.innerHTML = `
    ${openAccess ? `<div class="open-access-banner">
       <strong>Open-access mode</strong>  no authentication required. Create an admin account to lock down the UI.
    </div>` : ''}
    <div class="card">
      <div class="card-title" style="margin-bottom:8px">Users</div>
      <p style="color:var(--muted);font-size:12px;margin-bottom:16px">
        <b>Admins</b> can manage everything. <b>Viewers</b> can only browse the guide and stream.
        Auth is enforced via Bearer token, cookie, or <code>?token=</code> query param.
      </p>
      ${users.length === 0 ? `<div class="empty-state" style="padding:20px"><p>No users yet.</p></div>` : `
        <table>
          <thead><tr>
            <th>Username</th>
            <th>Role</th>
            <th>Last Login</th>
            <th>Status</th>
            <th style="text-align:right">Actions</th>
          </tr></thead>
          <tbody>${users.map(u => `<tr>
            <td style="font-weight:600">${esc(u.username)}</td>
            <td>
              <span class="badge ${u.role==='admin'?'blue':'gray'}">${u.role}</span>
            </td>
            <td style="color:var(--muted);font-size:11px;font-family:'DM Mono',monospace">${u.last_login ? new Date(u.last_login+'Z').toLocaleString([],{month:'short',day:'numeric',hour:'2-digit',minute:'2-digit'}) : '—'}</td>
            <td>
              <span class="badge ${u.enabled?'green':'red'}">${u.enabled?'Active':'Disabled'}</span>
            </td>
            <td style="text-align:right;white-space:nowrap">
              <div class="flex gap-8" style="justify-content:flex-end">
                <button class="btn btn-sm btn-secondary" onclick="showChangePasswordModal(${u.id},'${esc(u.username)}')">Password</button>
                <button class="btn btn-sm btn-secondary" onclick="toggleUserEnabled(${u.id},${u.enabled})">${u.enabled?'Disable':'Enable'}</button>
                <button class="btn btn-sm btn-danger" onclick="deleteUser(${u.id},'${esc(u.username)}')">Delete</button>
              </div>
            </td>
          </tr>`).join('')}</tbody>
        </table>`}
    </div>

    <div class="card">
      <div class="card-title" style="margin-bottom:10px">My Session</div>
      ${me ? `
        <p style="font-size:13px;margin-bottom:8px">Logged in as <strong>${esc(me.username)}</strong> (${me.role})</p>
        <button class="btn btn-secondary" onclick="doLogout()">Log out</button>
      ` : `<p style="color:var(--muted);font-size:13px">Not authenticated (open-access mode)</p>`}
    </div>
  `;
}

function showCreateUserModal() {
  modal(`
    <div class="modal-header"><div class="modal-title"> New User</div></div>
    <div style="display:grid;gap:12px;margin-top:8px">
      <div><label style="font-size:12px;color:var(--muted)">Username *</label>
        <input id="u-username" type="text" placeholder="username" style="width:100%;margin-top:4px;padding:7px 10px;border:1px solid var(--border);border-radius:6px;background:var(--surface);color:var(--text);font-size:13px;box-sizing:border-box" /></div>
      <div><label style="font-size:12px;color:var(--muted)">Password *</label>
        <input id="u-password" type="password" placeholder="" style="width:100%;margin-top:4px;padding:7px 10px;border:1px solid var(--border);border-radius:6px;background:var(--surface);color:var(--text);font-size:13px;box-sizing:border-box" /></div>
      <div><label style="font-size:12px;color:var(--muted)">Role</label>
        <select id="u-role" style="width:100%;margin-top:4px;padding:7px 10px;border:1px solid var(--border);border-radius:6px;background:var(--surface);color:var(--text);font-size:13px">
          <option value="viewer">viewer</option>
          <option value="admin">admin</option>
        </select></div>
    </div>
    <div class="modal-footer">
      <button class="btn btn-secondary" onclick="this.closest('.modal-overlay').remove()">Cancel</button>
      <button class="btn btn-primary" onclick="saveNewUser()">Create User</button>
    </div>
  `);
}

async function saveNewUser() {
  const body = {
    username: document.getElementById('u-username').value.trim(),
    password: document.getElementById('u-password').value,
    role:     document.getElementById('u-role').value,
  };
  if (!body.username || !body.password) return toast('Username and password required', 'error');
  try {
    await api('/api/users', { method: 'POST', body: JSON.stringify(body) });
    document.querySelector('.modal-overlay')?.remove();
    toast('User created');
    renderUsers();
  } catch(e) { toast(e.message, 'error'); }
}

function showChangePasswordModal(id, username) {
  modal(`
    <div class="modal-header"><div class="modal-title"> Change Password: ${esc(username)}</div></div>
    <div style="margin-top:8px">
      <label style="font-size:12px;color:var(--muted)">New Password *</label>
      <input id="u-newpw" type="password" placeholder="" style="width:100%;margin-top:4px;padding:7px 10px;border:1px solid var(--border);border-radius:6px;background:var(--surface);color:var(--text);font-size:13px;box-sizing:border-box" />
    </div>
    <div class="modal-footer">
      <button class="btn btn-secondary" onclick="this.closest('.modal-overlay').remove()">Cancel</button>
      <button class="btn btn-primary" onclick="changePassword(${id})">Change Password</button>
    </div>
  `);
}

async function changePassword(id) {
  const pw = document.getElementById('u-newpw').value;
  if (!pw) return toast('Password required', 'error');
  try {
    await api(`/api/users/${id}`, { method: 'PUT', body: JSON.stringify({ password: pw }) });
    document.querySelector('.modal-overlay')?.remove();
    toast('Password updated  existing sessions invalidated');
    renderUsers();
  } catch(e) { toast(e.message, 'error'); }
}

async function toggleUserEnabled(id, currentEnabled) {
  try {
    await api(`/api/users/${id}`, { method: 'PUT', body: JSON.stringify({ enabled: !currentEnabled }) });
    renderUsers();
  } catch(e) { toast(e.message, 'error'); }
}

async function deleteUser(id, username) {
  if (!confirm(`Delete user "${username}"? This cannot be undone.`)) return;
  try { await api(`/api/users/${id}`, { method: 'DELETE' }); toast('User deleted'); renderUsers(); }
  catch(e) { toast(e.message, 'error'); }
}

async function doLogout() {
  try { await api('/api/auth/logout', { method: 'POST' }); } catch(_) {}
  toast('Logged out');
  setTimeout(() => location.reload(), 800);
}

// 
//  Boot
// 
//  Restore persisted UI state then boot 
try {
  const savedFilter = localStorage.getItem('tvnow_guideFilter');
  if (savedFilter) _guideSourceFilter = parseInt(savedFilter, 10) || null;
} catch(_) {}

const _startPage = (() => { try { return localStorage.getItem('tvnow_page') || 'dashboard'; } catch(_) { return 'dashboard'; } })();
navigate(_startPage);
</script>
</body>
</html>
